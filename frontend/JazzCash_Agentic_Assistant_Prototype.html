<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JazzCash Assistant — Conversational Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --jc-red:#A6081C;
    --jc-red-dark:#6E0512;
    --jc-red-tint:#FBE7E9;
    --jc-gold:#F5C518;
    --jc-gold-dark:#8A6100;
    --jc-gold-tint:#FDECC8;
    --ink:#181818;
    --muted:#6B7280;
    --line:#ECECEE;
    --page:#EDEEF1;
    --white:#FFFFFF;
    --success:#1E8E3E;
    --success-tint:#E8F7EC;
    --warn-tint:#FFF6E5;
    --heal-tint:#E7F6EE;
    --heal-dark:#146C43;
    --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:var(--font); background:var(--page); display:flex; flex-direction:column; align-items:center; gap:14px; min-height:100vh; padding:28px 16px 60px; color:var(--ink); }
  .layout{ display:flex; align-items:flex-start; justify-content:center; gap:20px; flex-wrap:wrap; }

  /* ---------- side demo panel ---------- */
  .demo-bar{ width:220px; background:var(--ink); color:#fff; border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:10px; font-size:12px; }
  .demo-bar b{font-weight:700; color:var(--jc-gold); letter-spacing:.02em; display:block; font-size:12.5px; margin-bottom:2px;}
  .demo-bar .demo-hint{ font-size:11px; color:#ADADB2; line-height:1.45; margin-bottom:4px; }
  .demo-actions{ display:flex; flex-direction:column; gap:7px; }
  .demo-btn{ background:#2c2c2c; color:#fff; border:1px solid #3d3d3d; border-radius:8px; padding:9px 11px; font-size:12px; font-family:var(--font); cursor:pointer; text-align:left; width:100%; transition:opacity .2s; }
  .demo-btn:hover{background:#3a3a3a;}
  .demo-btn:disabled{ opacity:.35; cursor:not-allowed; }

  /* ---------- phone ---------- */
  .phone{ width:390px; height:844px; max-width:100%; background:var(--white); border-radius:38px; box-shadow:0 30px 60px -20px rgba(0,0,0,.35), 0 0 0 10px #0c0c0e; overflow:hidden; position:relative; display:flex; flex-direction:column; }
  .notch{ position:absolute; top:0; left:50%; transform:translateX(-50%); width:120px; height:22px; background:#0c0c0e; border-radius:0 0 14px 14px; z-index:50; }
  .status-row{ display:flex; justify-content:space-between; align-items:center; padding:14px 20px 4px; font-size:12px; font-weight:600; flex-shrink:0; }

  .screens{ flex:1; min-height:0; position:relative; }
  .screen{ position:absolute; inset:0; overflow-y:auto; display:none; padding-bottom:16px; }
  .screen.active{ display:block; }
  .screen::-webkit-scrollbar{ display:none; }

  .app-header{ display:flex; align-items:center; justify-content:space-between; padding:14px 20px 14px; flex-shrink:0; }
  .brand{ display:flex; align-items:center; gap:7px; }
  .brand img{ height:24px; }
  .brand-fallback{ font-weight:800; font-size:19px; letter-spacing:-.02em; }
  .brand-fallback .jazz{ color:var(--ink); } .brand-fallback .cash{ color:var(--jc-red); }
  .icon-btn{ width:36px; height:36px; border-radius:50%; background:#F1F1F3; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#555; border:none; flex-shrink:0; }
  .icon-btn svg{ width:17px; height:17px; }

  .balance-card{ margin:0 20px 14px; padding:20px; border-radius:20px; color:#fff; background:radial-gradient(120% 130% at 85% -10%, #D4132A 0%, var(--jc-red) 42%, var(--jc-red-dark) 100%); position:relative; overflow:hidden; }
  .balance-label{ font-size:12px; opacity:.85; font-weight:500; }
  .balance-amount{ font-size:29px; font-weight:800; margin:4px 0 14px; letter-spacing:-.02em; }
  .balance-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .add-money-btn{ background:var(--jc-gold); color:#4A3300; border:none; padding:10px 16px; border-radius:22px; font-size:12.5px; font-weight:800; font-family:var(--font); cursor:pointer; display:flex; align-items:center; gap:6px; }
  .add-money-btn:hover{ filter:brightness(0.96); }
  .masked-card-text{ font-size:11.5px; color:rgba(255,255,255,.85); font-weight:500; }

  .quick-row{ display:flex; justify-content:space-between; padding:4px 12px 20px; gap:2px; }
  .quick-item{ display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; width:52px; flex:1; min-width:0; }
  .quick-icon{ width:52px; height:52px; border-radius:50%; background:var(--jc-red-tint); display:flex; align-items:center; justify-content:center; color:var(--jc-red); }
  .quick-icon svg{ width:21px; height:21px; }
  .quick-item span{ font-size:10.5px; font-weight:600; text-align:center; color:var(--ink); line-height:1.2; }

  .offers-wrap{ padding:0 0 18px; }
  .offers-scroll{ display:flex; gap:10px; overflow-x:auto; padding:0 20px 4px; scrollbar-width:none; }
  .offers-scroll::-webkit-scrollbar{ display:none; }
  .offer-card{ flex:0 0 auto; width:210px; background:linear-gradient(135deg,#FFF8E6,#FFF1CC); border:1px solid #F2DFA0; border-radius:16px; padding:12px 13px; }
  .offer-card .row1{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .offer-card .ico{ width:30px; height:30px; border-radius:9px; background:#fff; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
  .offer-card b{ font-size:12.5px; }
  .offer-card .disc{ font-size:11.5px; font-weight:800; color:var(--jc-red-dark); display:block; }
  .offer-card .reason{ font-size:10.5px; color:var(--muted); line-height:1.3; margin-top:3px; }

  .nudge-banner{ margin:0 20px 16px; background:var(--warn-tint); border:1px solid #F3DFA6; border-radius:14px; padding:12px 14px; display:none; gap:10px; align-items:flex-start; cursor:pointer; }
  .nudge-banner.show{ display:flex; }
  .nudge-banner .ic{ font-size:18px; }
  .nudge-banner .txt b{ display:block; font-size:12.5px; margin-bottom:2px; }
  .nudge-banner .txt span{ font-size:12px; color:var(--muted); }

  .section-label{ padding:0 20px 10px; font-size:13.5px; font-weight:700; display:flex; justify-content:space-between; align-items:center; }
  .section-label a{ font-size:11.5px; color:var(--jc-red); font-weight:600; text-decoration:none; }

  .txn-list{ padding:0 20px; display:flex; flex-direction:column; gap:9px; }
  .txn{ display:flex; align-items:center; gap:12px; padding:12px 13px; cursor:pointer; background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:0 1px 2px rgba(16,16,18,.04); transition:box-shadow .15s ease, transform .15s ease; }
  .txn:hover{ box-shadow:0 4px 12px rgba(16,16,18,.08); transform:translateY(-1px); }
  .txn.is-fail{ background:var(--jc-red-tint); border-color:#F0CACD; }
  .txn-icon{ width:38px; height:38px; border-radius:50%; background:#F1F1F3; display:flex; align-items:center; justify-content:center; color:var(--jc-red); flex-shrink:0; }
  .txn-icon svg{ width:16px; height:16px; }
  .txn-icon.fail{ background:#F6D9DC; }
  .txn-icon.credit{ background:var(--success-tint); color:var(--success); }
  .txn-body{ flex:1; min-width:0; }
  .txn-title{ font-size:13px; font-weight:600; }
  .txn-sub{ font-size:11.5px; color:var(--muted); margin-top:1px; }
  .txn-hint{ font-size:11px; color:var(--jc-red); font-weight:700; margin-top:2px; }
  .txn-amt{ font-size:13px; font-weight:700; white-space:nowrap; text-align:right; }
  .txn-amt.debit{ color:var(--ink); }
  .txn-amt.credit{ color:var(--success); }
  .txn-amt.fail{ color:var(--jc-red); }
  .txn-status{ font-size:10px; font-weight:700; margin-top:3px; text-align:right; }
  .txn-status.ok{ color:var(--success); }
  .txn-status.bad{ color:var(--jc-red); }
  .list-tip{ margin:14px 20px 0; font-size:11.5px; color:var(--muted); }

  /* ---------- tab bar ---------- */
  .tabbar{ position:relative; flex-shrink:0; height:74px; background:#fff; border-top:1px solid var(--line); display:flex; padding-bottom:12px; z-index:40; }
  .tab{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; cursor:pointer; color:#9CA0A6; font-size:10.5px; font-weight:600; position:relative; background:none; border:none; font-family:var(--font); }
  .tab svg{ width:19px; height:19px; }
  .tab.active{ color:var(--jc-red); }
  .tab .tab-dot{ position:absolute; top:2px; right:26%; width:8px; height:8px; background:var(--jc-red); border-radius:50%; border:2px solid #fff; display:none; }

  /* ---------- floating assistant button ---------- */
  .fab{ position:absolute; right:18px; bottom:90px; width:56px; height:56px; border-radius:50%; background:var(--jc-red); box-shadow:0 10px 24px -6px rgba(166,8,28,.55); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:45; border:none; }
  .fab svg{ width:24px; height:24px; }

  /* ---------- toast ---------- */
  .toast{ position:absolute; top:16px; left:14px; right:14px; background:var(--ink); color:#fff; border-radius:13px; padding:11px 13px; display:flex; gap:10px; align-items:flex-start; box-shadow:0 12px 24px rgba(0,0,0,.25); transform:translateY(-120px); transition:transform .35s ease; z-index:90; cursor:pointer; }
  .toast.show{ transform:translateY(0); }
  .toast .ic{ font-size:16px; }
  .toast b{ display:block; font-size:12px; color:var(--jc-gold); margin-bottom:2px; }
  .toast span{ font-size:12px; line-height:1.35; color:#eee; }
  .toast.heal b{ color:#8FE0B4; }

  /* ---------- assistant bottom sheet ---------- */
  .sheet-overlay{ position:absolute; inset:0; background:rgba(0,0,0,.35); z-index:60; opacity:0; pointer-events:none; transition:opacity .25s ease; }
  .sheet-overlay.show{ opacity:1; pointer-events:auto; }
  .sheet{ position:absolute; left:0; right:0; bottom:0; height:88%; background:#fff; border-radius:22px 22px 0 0; z-index:70; transform:translateY(100%); transition:transform .32s cubic-bezier(.32,.72,0,1); display:flex; flex-direction:column; box-shadow:0 -10px 30px rgba(0,0,0,.2); }
  .sheet.show{ transform:translateY(0); }
  .sheet-handle{ width:40px; height:4px; background:#DDD; border-radius:3px; margin:10px auto 4px; flex-shrink:0; }
  .sheet-header{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 14px 12px; border-bottom:1px solid var(--line); flex-shrink:0; }
  .sheet-header .who{ display:flex; align-items:center; gap:9px; min-width:0; flex:1; }
  .sheet-avatar{ width:34px; height:34px; border-radius:50%; background:var(--jc-red); color:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; flex-shrink:0; }
  .sheet-header h3{ margin:0; font-size:14px; line-height:1.25; display:flex; flex-wrap:wrap; align-items:center; gap:4px; }
  .sheet-header p{ margin:2px 0 0; font-size:11px; color:var(--muted); font-weight:500; line-height:1.35; }
  .sheet-close{ width:30px; height:30px; border-radius:50%; background:#F5F5F6; border:none; font-size:14px; cursor:pointer; color:var(--muted); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .sheet-close svg{ width:14px; height:14px; }
  .sheet-header-actions{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .lang-toggle{ display:flex; background:#F2F2F4; border-radius:999px; padding:3px; gap:2px; border:1px solid var(--line); }
  .lang-toggle button{ border:none; background:transparent; border-radius:999px; padding:6px 10px; font-size:11px; font-weight:800; font-family:var(--font); color:var(--muted); cursor:pointer; line-height:1; }
  .lang-toggle button.active{ background:var(--jc-red); color:#fff; box-shadow:0 2px 6px rgba(166,8,28,.25); }
  .lang-toggle button#lang-ur{ font-family:'Noto Nastaliq Urdu',Inter,sans-serif; font-size:12px; padding:5px 11px; }

  .chat-log{ flex:1; min-height:0; overflow-y:auto; padding:14px 14px 8px; display:flex; flex-direction:column; gap:10px; }
  .chat-log::-webkit-scrollbar{ display:none; }
  .msg-row{ display:flex; gap:8px; width:100%; max-width:100%; align-items:flex-start; box-sizing:border-box; }
  .msg-row.user{ justify-content:flex-end; }
  .msg-row.assistant{ justify-content:flex-start; }
  .msg-avatar{ width:26px; height:26px; border-radius:50%; background:var(--jc-red); color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:2px; }
  .msg-body{ display:flex; flex-direction:column; align-items:stretch; gap:8px; flex:1; min-width:0; max-width:calc(100% - 34px); }
  .msg-row.user .msg-body{ flex:0 1 auto; max-width:82%; align-items:flex-end; }
  .bubble{ width:fit-content; max-width:100%; padding:10px 13px; border-radius:15px; font-size:13px; line-height:1.5; word-break:break-word; box-sizing:border-box; }
  .msg-row.assistant .bubble{ background:#F2F2F4; border-top-left-radius:4px; align-self:flex-start; }
  .msg-row.assistant .bubble b{ color:var(--jc-red-dark); }
  .msg-row.user .bubble{ background:var(--jc-red); color:#fff; border-top-right-radius:4px; max-width:100%; }
  .proactive-tag, .heal-tag{ font-size:9.5px; font-weight:800; padding:2px 7px; border-radius:20px; display:inline-block; letter-spacing:.02em; align-self:flex-start; }
  .proactive-tag{ color:var(--jc-red-dark); background:var(--jc-red-tint); }
  .heal-tag{ color:var(--heal-dark); background:var(--heal-tint); }

  .inline-chip-row{ display:flex; flex-wrap:wrap; gap:7px; width:100%; max-width:100%; margin:0; padding:0; box-sizing:border-box; align-items:stretch; }
  .inline-chip{ background:#fff; border:1.5px solid var(--jc-red); color:var(--jc-red-dark); border-radius:20px; padding:8px 12px; font-size:12px; font-weight:700; cursor:pointer; font-family:var(--font); line-height:1.35; text-align:center; white-space:normal; max-width:100%; box-sizing:border-box; }
  .inline-chip:hover{ background:var(--jc-red-tint); }

  .card{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:13px; width:100%; max-width:100%; font-size:12.5px; box-sizing:border-box; align-self:stretch; }
  .card-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:6px 0; font-size:12.5px; }
  .card-row .k{ color:var(--jc-gold-dark); font-weight:600; flex:1; min-width:0; line-height:1.4; }
  .card-row .v{ font-weight:700; text-align:right; flex-shrink:0; line-height:1.4; }
  .card-title{ display:flex; align-items:center; gap:9px; margin-bottom:8px; }
  .card-title > div:last-child{ min-width:0; flex:1; }
  .card-title .av{ width:34px; height:34px; border-radius:50%; background:var(--jc-gold-tint); color:var(--jc-gold-dark); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex-shrink:0; overflow:hidden; }
  .card-title .av svg{ width:16px; height:16px; display:block; }
  .card-title b{ font-size:13.5px; display:block; line-height:1.3; overflow:hidden; text-overflow:ellipsis; }
  .card-title small{ color:var(--success); font-size:11px; font-weight:600; display:block; line-height:1.35; margin-top:2px; }
  .card hr{ border:none; border-top:1px dashed var(--line); margin:8px 0; }
  .flag{ background:var(--warn-tint); color:#8a6100; font-size:11px; font-weight:600; padding:6px 9px; border-radius:9px; margin:8px 0; }
  .btn-row{ display:flex; gap:8px; margin-top:11px; width:100%; align-items:stretch; }
  .btn{ flex:1; min-width:0; padding:10px 8px; border-radius:22px; font-size:12px; font-weight:700; border:none; cursor:pointer; font-family:var(--font); line-height:1.3; text-align:center; display:inline-flex; align-items:center; justify-content:center; box-sizing:border-box; }
  .btn.primary{ background:var(--jc-red); color:#fff; }
  .btn.primary:hover{ background:var(--jc-red-dark); }
  .btn.outline{ background:#fff; color:var(--ink); border:1.5px solid var(--line); }
  .btn.outline:hover{ background:#F7F7F8; }
  .fund-option{ display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 10px; border:1.5px solid var(--line); border-radius:11px; margin-bottom:7px; font-size:12px; box-sizing:border-box; }
  .fund-option.best{ border-color:var(--jc-red); background:var(--jc-red-tint); }
  .fund-option .tag{ font-size:9.5px; font-weight:800; color:var(--jc-red-dark); }
  .success-box{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:4px; padding:14px 8px 6px; width:100%; box-sizing:border-box; }
  .success-check{ width:44px; height:44px; border-radius:50%; background:var(--success-tint); color:var(--success); display:flex; align-items:center; justify-content:center; font-size:22px; margin-bottom:4px; }
  .promo-code{ margin-top:8px; background:var(--ink); color:var(--jc-gold); font-weight:800; letter-spacing:.06em; text-align:center; padding:9px 0; border-radius:9px; font-size:13.5px; }

  .chip-row{ display:flex; gap:7px; flex-wrap:nowrap; overflow-x:auto; padding:10px 14px; border-top:1px solid var(--line); flex-shrink:0; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .chip-row::-webkit-scrollbar{ display:none; }
  .chip{ background:#F2F2F4; border:1px solid var(--line); border-radius:20px; padding:7px 12px; font-size:11.5px; font-weight:600; cursor:pointer; color:var(--ink); white-space:nowrap; flex-shrink:0; line-height:1.3; }
  .chip:hover{ background:#E9E9EB; }

  .composer{ display:flex; align-items:center; gap:8px; padding:10px 14px 16px; flex-shrink:0; }
  .composer input{ flex:1; min-width:0; border:1px solid var(--line); background:#F7F7F8; border-radius:22px; padding:11px 16px; font-size:13px; font-family:var(--font); outline:none; }
  .composer input:focus{ border-color:var(--jc-red); }
  .composer button{ width:40px; height:40px; border-radius:50%; background:var(--jc-red); color:#fff; border:none; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .composer button svg{ width:17px; height:17px; }
  .composer button:disabled{ opacity:.45; cursor:not-allowed; }

  .ai-badge{ font-size:10px; font-weight:700; color:var(--jc-red-dark); background:var(--jc-red-tint); padding:2px 8px; border-radius:999px; margin-left:6px; vertical-align:middle; white-space:nowrap; }

  /* Nested chips/cards inside LLM bubble column */
  .msg-body .inline-chip-row{ margin:0; max-width:100%; }
  .msg-body .card{ max-width:100%; }

  /* Standalone chip rows (rare) still align under avatar column */
  .chat-log > .inline-chip-row{ margin-left:34px; width:calc(100% - 34px); max-width:calc(100% - 34px); }

  body.lang-urdu .msg-row.assistant .bubble,
  body.lang-urdu .msg-body .bubble,
  body.lang-urdu .card,
  body.lang-urdu .inline-chip{ font-family:'Noto Nastaliq Urdu',Inter,sans-serif; line-height:1.7; }
  body.lang-urdu .msg-row.assistant .bubble,
  body.lang-urdu .card-row .k,
  body.lang-urdu .card-title b,
  body.lang-urdu .card-title small{ text-align:right; direction:rtl; }
  body.lang-urdu .card-row{ flex-direction:row-reverse; }
  body.lang-urdu .card-row .v{ text-align:left; }
  body.lang-urdu .inline-chip-row{ justify-content:flex-end; }
  body.lang-urdu .btn-row{ flex-direction:row-reverse; }

  .typing{ display:flex; gap:4px; padding:4px 6px; }
  .typing span{ width:6px; height:6px; background:#B9B9BD; border-radius:50%; animation:blink 1.2s infinite ease-in-out; }
  .typing span:nth-child(2){ animation-delay:.2s; }
  .typing span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink{ 0%,80%,100%{ opacity:.3; } 40%{ opacity:1; } }

  /* ---------- profile screen ---------- */
  .profile-user{ margin:0 20px 14px; background:#fff; border:1px solid var(--line); border-radius:16px; padding:13px; display:flex; align-items:center; gap:12px; }
  .profile-avatar{ width:44px; height:44px; border-radius:50%; background:var(--jc-gold); color:#4A3300; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:17px; flex-shrink:0; }
  .profile-user b{ font-size:14.5px; display:block; }
  .profile-user span{ font-size:11.5px; color:var(--muted); }
  .stat-row{ display:flex; gap:10px; margin:0 20px 14px; }
  .stat-card{ flex:1; background:#fff; border:1px solid var(--line); border-radius:14px; padding:13px; }
  .stat-card .lbl{ font-size:11px; color:var(--muted); margin-bottom:4px; }
  .stat-card .val{ font-size:15.5px; font-weight:800; }
  .action-row{ margin:0 20px 10px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:13px 15px; display:flex; align-items:center; gap:12px; cursor:pointer; }
  .action-row:hover{ background:#FAFAFA; }
  .action-row .aicon{ width:22px; height:22px; flex-shrink:0; }
  .action-row span{ font-size:13px; font-weight:600; }

function buildLoanPlans(outstanding, lateFees, dueInDays){
  const owed = outstanding + lateFees;

      installment: minDue,
      count: Math.ceil(owed / minDue),
      totalPayable: owed,
      feeImpact: dueInDays < 0 ? "stops_fees" : "keeps_schedule",

  const usedFirst = new Set();
  const contacts = [];
  while(contacts.length < 6){
    const c = { name: randomName(), phone: randomPhone() };
    const first = c.name.split(" ")[0];
    if(usedFirst.has(first)) continue;
    usedFirst.add(first);
    contacts.push(c);
  }

  const billers = BILLERS.map(b => ({ ...b, amount: randInt(1500,9800), increase: randInt(150,900), dueInDays: randInt(1,6) }));
  const flaggedBiller = pick(billers);

  const pkg = pick(PACKAGES);
  const topupExpiresHours = randInt(6,30);

  const balance = randInt(18000, 62000);
  const last4 = String(randInt(1000,9999));

  const failedMerchant = pick(MERCHANTS);
  const failedAmount = randInt(500,4000);
  const salaryCompany = pick(COMPANIES);

  const offers = [OFFER_POOL[0], OFFER_POOL[1], OFFER_POOL[2], OFFER_POOL[3]]
    .sort(()=>Math.random()-0.5).slice(0,3)
    .map(o => ({ merchant:o.merchant, ico:o.ico, discount: pick(o.discounts), reason: pick(o.reasons) }));

  state = {
    myName, myPhone: randomPhone(), last4, kycLevel,
    balance, contacts, billers, flaggedBiller,
    pkg, topupExpiresHours, offers,
    totalSent: randInt(4000,15000), totalReceived: randInt(20000,60000),
    fundOptions: [
      {name:"Bank Transfer", fee:0, mins:"2-5 min"},
      {name:"Debit/Credit Card", fee:randInt(40,80), mins:"instant"},
      {name:"Agent Cash-In", fee:randInt(20,50), mins:"instant"},
    ],
    failedTxn: { title: failedMerchant, amount: failedAmount, deducted:false },
    loan: makeDemoLoan(),
    txns: [
      {type:"merchant", title:failedMerchant, sub:"Merchant payment", when:"Today, "+pad(randInt(7,11))+":"+pad(randInt(0,59)), amount:failedAmount, sign:"-", ok:false, hint:"Tap for help"},
      {type:"bill", title:flaggedBiller.name+" Bill", sub:"Utility payment", when:"Today, "+pad(randInt(7,11))+":"+pad(randInt(0,59)), amount:randInt(1500,9000), sign:"-", ok:true},
      {type:"credit", title:"Salary — "+salaryCompany, sub:"Bank transfer in", when:"Yesterday, "+pad(randInt(15,19))+":"+pad(randInt(0,59)), amount:randInt(35000,90000), sign:"+", ok:true},
      {type:"topup", title:pkg.name, sub:"Mobile top-up", when:pick(["Mon","Tue","2 days ago"])+", "+pad(randInt(9,13))+":"+pad(randInt(0,59)), amount:pkg.price, sign:"-", ok:true},
    ],
    badge: 0,
    convo: { pendingOptions: [], pendingResolver: null, pendingTextResolver: null, chipRowCounter: 0 },
  };
}

function renderOffers(){
  document.getElementById("offers-scroll").innerHTML = state.offers.map(o => `
    <div class="offer-card">
      <div class="row1"><div class="ico">${o.ico}</div><b>${o.merchant}</b></div>
      <span class="disc">${o.discount}</span>
      <div class="reason">${o.reason}</div>
    </div>`).join("");
}

const TYPE_ICON = {bill:"arrowUpRight", merchant:"arrowUpRight", topup:"arrowUpRight", send:"arrowUpRight", credit:"arrowDownLeft"};
function txnRow(txn){
  const clickAttr = (!txn.ok) ? "startRecoveryFor(event)" : "";
  const iconKey = TYPE_ICON[txn.type] || "arrowUpRight";
  const iconClass = !txn.ok ? "fail" : (txn.sign==="+" ? "credit" : "");
  const amtClass = !txn.ok ? "fail" : (txn.sign==="+" ? "credit" : "debit");
  const statusLabel = txn.ok ? t("status_ok") : t("status_fail");
  const hint = txn.hint ? t("hint_help") : "";
  return `<div class="txn ${!txn.ok?'is-fail':''}" onclick="${clickAttr}">
    <div class="txn-icon ${iconClass}">${ICONS[iconKey]}</div>
    <div class="txn-body">
      <div class="txn-title">${txn.title}</div>
      <div class="txn-sub">${txn.sub} · ${txn.when}</div>
      ${hint ? `<div class="txn-hint">${hint}</div>` : ""}
    </div>
    <div>
      <div class="txn-amt ${amtClass}">${txn.sign}${fmt(txn.amount)}</div>
      <div class="txn-status ${txn.ok?'ok':'bad'}">${statusLabel}</div>
    </div>
  </div>`;
}
function renderTxns(){
  document.getElementById("home-txns").innerHTML = state.txns.slice(0,4).map(txnRow).join("");
  document.getElementById("history-txns").innerHTML = state.txns.map(txnRow).join("");
}

/* ---------- chat plumbing ---------- */
function scrollChat(){ const log=document.getElementById("chat-log"); log.scrollTop = log.scrollHeight; }
function addUser(text){
  document.getElementById("chat-log").insertAdjacentHTML("beforeend",
    `<div class="msg-row user"><div class="msg-body"><div class="bubble">${text}</div></div></div>`);
  scrollChat();
}
function addAssistantHTML(html, tagType){
  const tag = tagType==="proactive" ? `<div class="proactive-tag">PROACTIVE · SENT BY ASSISTANT</div>`
            : tagType==="heal" ? `<div class="heal-tag">\u2713 AUTO-RESOLVED BY ASSISTANT</div>` : "";
  document.getElementById("chat-log").insertAdjacentHTML("beforeend",
    `<div class="msg-row assistant"><div class="msg-avatar">JC</div><div class="msg-body">${tag}${html}</div></div>`);
  scrollChat();
}
function addTyping(){
  document.getElementById("chat-log").insertAdjacentHTML("beforeend",
    `<div class="msg-row assistant" id="typing-row"><div class="msg-avatar">JC</div><div class="msg-body"><div class="bubble typing"><span></span><span></span><span></span></div></div></div>`);
  scrollChat();
}
function removeTyping(){ const t=document.getElementById("typing-row"); if(t) t.remove(); }
function afterDelay(fn){ addTyping(); setTimeout(()=>{ removeTyping(); fn(); }, 500 + Math.random()*250); }

function seedGreeting(){
  const name = state.myName.split(" ")[0];
  addAssistantHTML(`<div class="bubble">${t("greeting", { name })}</div>`);
}

/* ---------- conversational question helpers ---------- */
function appendToLastAssistant(html){
  const bodies = document.querySelectorAll("#chat-log .msg-row.assistant .msg-body");
  const last = bodies[bodies.length - 1];
  if(last){
    last.insertAdjacentHTML("beforeend", html);
    scrollChat();
    return true;
  }
  addAssistantHTML(html);
  return false;
}
function askChips(promptHTML, options, resolver){
  addAssistantHTML(`<div class="bubble">${promptHTML}</div>`);
  state.convo.chipRowCounter++;
  const rid = "chiprow" + state.convo.chipRowCounter;
  state.convo.pendingOptions = options;
  state.convo.pendingResolver = resolver;
  const chipsHtml = options.map((o,i)=>`<button class="inline-chip" onclick="pickOption(${i},'${rid}')">${o.label}</button>`).join("");
  appendToLastAssistant(`<div class="inline-chip-row" id="${rid}">${chipsHtml}</div>`);
}
function pickOption(i, rid){
  const opt = state.convo.pendingOptions[i];
  if(!opt) return;
  const row = document.getElementById(rid);
  if(row) row.remove();
  addUser(opt.label);
  const resolver = state.convo.pendingResolver;
  state.convo.pendingOptions = []; state.convo.pendingResolver = null;
  if(resolver) afterDelay(()=>resolver(opt));
}
function askText(promptHTML, resolver, placeholder){
  addAssistantHTML(`<div class="bubble">${promptHTML}</div>`);
  state.convo.pendingTextResolver = resolver;
  const input = document.getElementById("chat-input");
  if(placeholder) input.placeholder = placeholder;
  input.focus();
}
function resetTextPlaceholder(){
  const input = document.getElementById("chat-input");
  if(!input) return;
  input.placeholder = t("placeholder");
}

function t(key, vars){
  const pack = I18N[jcReplyLanguage] || I18N.english;
  let s = pack[key] ?? I18N.english[key] ?? key;
  if(vars){
    Object.keys(vars).forEach(k => { s = s.replace("{"+k+"}", String(vars[k])); });
  }
  return s;
}

function applyAppLanguage(){
  document.body.classList.toggle("lang-urdu", jcReplyLanguage === "urdu");
  document.documentElement.lang = jcReplyLanguage === "urdu" ? "ur" : "en";
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if(key) el.textContent = t(key);
  });
  document.querySelectorAll(".lang-toggle button[data-lang]").forEach(btn => {
    btn.classList.toggle("active", btn.getAttribute("data-lang") === jcReplyLanguage);
  });
  resetTextPlaceholder();
  if(typeof state !== "undefined" && state && state.txns){
    document.getElementById("masked-card").textContent =
      t("wallet_label") + " · \u2022\u2022\u2022\u2022 " + state.last4;
    if(state.myPhone){
      document.getElementById("profile-phone").textContent =
        state.myPhone + " · " + t("verified_level", { n: state.kycLevel });
    }
    renderTxns();
  }
}

function setReplyLanguage(lang, opts){
  const silent = opts && opts.silent;
  jcReplyLanguage = (lang === "urdu") ? "urdu" : "english";
  localStorage.setItem("jc_reply_language", jcReplyLanguage);
  applyAppLanguage();
  if(!silent){
    addAssistantHTML(`<div class="bubble">${t("lang_note")}</div>`);
  }
}

function syncLangToggleUI(){
  applyAppLanguage();
}

function escapeHtml(s){
  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function routeFromAction(route){
  if(!route) return null;
  const r = String(route).toLowerCase();
  if(r.includes("loan") || r.includes("ready-cash") || r.includes("readycash") || r.includes("repay") || r.includes("installment") || r.includes("qarz")) return "loan";
  if(r.includes("send") || r.includes("transfer") || r.includes("raast")) return "send";
  if(r.includes("bill")) return "bill";
  if(r.includes("recharge") || r.includes("topup") || r.includes("top-up") || r.includes("mobile")) return "topup";
  if(r.includes("add") || r.includes("fund") || r.includes("cash-in") || r.includes("cashin")) return "addmoney";
  if(r.includes("support") || r.includes("recover") || r.includes("fail") || r.includes("transaction")) return "recovery";
  return null;
}

function renderLlmReply(data){
  const text = escapeHtml(data.response || "Sorry, I couldn't generate a reply.");
  const urduClass = (data.language === "urdu") ? ' style="font-family:\'Noto Nastaliq Urdu\',Inter,sans-serif; line-height:1.7;"' : "";
  let html = `<div class="bubble"${urduClass}>${text.replace(/\n/g,"<br>")}</div>`;

  const action = data.suggested_action;
  if(action && action.label && action.route){
    const module = routeFromAction(action.route);
    const safeLabel = escapeHtml(action.label);
    if(module){
      html += `<div class="inline-chip-row">
        <button class="inline-chip" onclick="quickStart('${module}')">${safeLabel}</button>
      </div>`;
    } else {
      html += `<div class="inline-chip-row">
        <button class="inline-chip" onclick="addAssistantHTML('<div class=\\'bubble\\'>Open <b>${escapeHtml(action.route)}</b> in the JazzCash app to continue.</div>')">${safeLabel}</button>
      </div>`;
    }
  }

  if(data.blocked_transaction){
    html += `<div class="inline-chip-row">
      <button class="inline-chip" onclick="quickStart('send')">Guide me: Send Money</button>
    </div>`;
  }

  const prompts = (data.suggested_prompts || []).slice(0, 3);
  if(prompts.length){
    html += `<div class="inline-chip-row">` +
      prompts.map(p => `<button class="inline-chip" onclick="sendFreeText(${JSON.stringify(p)})">${escapeHtml(p)}</button>`).join("") +
      `</div>`;
  }

  addAssistantHTML(html);
}

async function askBackend(message){
  const context = {
    prototype: "JazzCash_Agentic_Assistant_Prototype",
    preferred_language: jcReplyLanguage,
    user: {
      name: state.myName,
      phone: state.myPhone,
      wallet_balance: state.balance,
      kyc_level: state.kycLevel,
    },
    ready_cash_loan: state.loan ? {
      product: state.loan.product,
      outstanding: state.loan.outstanding,
      late_fees: state.loan.lateFees,
      late_fee_per_day: state.loan.lateFeePerDay,
      due_in_days: state.loan.dueInDays,
      days_behind: state.loan.daysBehind,
      behind: state.loan.behind,
      next_installment: state.loan.nextInstallment,
      selected_plan: state.loan.selectedPlanId,
      plans: state.loan.plans.map(p => ({
        id: p.id,
        installment: p.installment,
        count: p.count,
        total_payable: p.totalPayable,
      })),
    } : null,
    note: "Concept Demo — UI modules can guide; assistant must not execute real money moves. For loan questions, guide the user to the Loan Plans flow (/loans) and explain plans/fees using ready_cash_loan context.",
  };
  const res = await fetch(`${API_BASE}/api/chat`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      message,
      session_id: jcSessionId || undefined,
      stream: false,
      preferred_language: jcReplyLanguage,
      context,
    }),
  });
  if(!res.ok){
    const errText = await res.text();
    throw new Error(errText || res.statusText);
  }
  const data = await res.json();
  if(data.session_id) jcSessionId = data.session_id;
  return data;
}

async function sendFreeText(text){
  const msg = String(text || "").trim();
  if(!msg || jcChatBusy) return;
  jcChatBusy = true;
  addUser(msg);
  addTyping();
  try{
    const data = await askBackend(msg);
    removeTyping();
    renderLlmReply(data);
  } catch(err){
    removeTyping();
    addAssistantHTML(`<div class="bubble">${t("api_error")}<br><span style="color:var(--muted); font-size:11px;">${escapeHtml(err.message || err)}</span></div>`);
  } finally {
    jcChatBusy = false;
  }
}

function handleComposerSend(){
  const input = document.getElementById("chat-input");
  const text = input.value.trim();
  if(!text) return;
  input.value = "";
  // Multi-turn module flows still capture free text when waiting for an answer
  if(state.convo.pendingTextResolver){
    addUser(text);
    const resolver = state.convo.pendingTextResolver;
    state.convo.pendingTextResolver = null;
    resetTextPlaceholder();
    return afterDelay(()=>resolver(text));
  }
  // Free chat → real Jazz Gemma backend
  sendFreeText(text);
}
function quickStart(kind){
  state.convo.pendingOptions = []; state.convo.pendingResolver = null; state.convo.pendingTextResolver = null;
  resetTextPlaceholder();
  if(kind==="send") return startSend({});
  if(kind==="bill") return startBill();
  if(kind==="topup") return startTopup();
  if(kind==="addmoney") return startAddMoney();
  if(kind==="recovery") return startRecovery();
  if(kind==="loan") return startLoan();
}

function startSend(prefill){
  const data = Object.assign({contact:null, amount:null}, prefill);
  if(data.contact && data.amount) return showSendConfirm(data);
  if(data.contact) return askSendAmount(data);
  addUser(t("flow_send_user"));
  afterDelay(()=>{
    const options = state.contacts.slice(0,4).map(c=>({label:c.name.split(" ")[0], contact:c}));
    options.push({label:t("flow_send_someone"), other:true});
    askChips(t("flow_send_who"), options, (opt)=>{
      if(opt.other){
        askText(t("flow_send_name"), (name)=>{
          const found = state.contacts.find(c=>c.name.toLowerCase().includes(name.toLowerCase())) || {name, phone:randomPhone()};
          askSendAmount({contact:found});
        }, "e.g. Bilal");
      } else askSendAmount({contact:opt.contact});
    });
  });
}
function askSendAmount(data){
  askText(t("flow_send_amount", { name: data.contact.name.split(" ")[0] }), (text)=>{
    const m = text.match(/[\d,]+/);
    const amt = m ? parseInt(m[0].replace(/,/g,"")) : randInt(500,5000);
    showSendConfirm(Object.assign({}, data, {amount:amt}));

}

function loanDueLabel(){
  const L = state.loan;
  if(L.behind || L.dueInDays < 0) return t("flow_loan_due_overdue", { days: L.daysBehind || Math.abs(L.dueInDays) });
  return t("flow_loan_due_in", { days: L.dueInDays });
}

function refreshLoanPlans(){
  const L = state.loan;
  L.plans = buildLoanPlans(L.outstanding, L.lateFees, L.dueInDays);
  const sel = L.plans.find(p => p.id === L.selectedPlanId) || L.plans[1];
  L.selectedPlanId = sel.id;
  L.nextInstallment = sel.installment;
}

function startLoan(step){
  if(!state.loan) state.loan = makeDemoLoan();
  if(step === "plans") return showLoanPlans();
  if(step === "pay") return askLoanPayAmount();
  if(step === "fees") return explainLoanFees();
  addUser(t("flow_loan_user"));
  afterDelay(()=>{
    showLoanStatusCard();

      if(opt.action==="plans") return showLoanPlans();
      if(opt.action==="pay") return askLoanPayAmount();
      if(opt.action==="fees") return explainLoanFees();
    });
  });

      <div class="card-row"><span class="k">${t("flow_loan_late_fees")}</span><span class="v">${L.lateFees > 0 ? fmt(L.lateFees) : "—"}</span></div>
      <div class="card-row"><span class="k">${t("flow_loan_due")}</span><span class="v">${fmt(L.nextInstallment)}</span></div>
      <div class="card-row"><span class="k">${t("flow_loan_rate")}</span><span class="v">${fmt(L.lateFeePerDay)}/day</span></div>
    </div>`);
}

function showLoanPlans(){
  refreshLoanPlans();
  const L = state.loan;
  addAssistantHTML(`<div class="bubble">${t("flow_loan_plans_intro")}</div>`);
  const options = L.plans.map(p => ({
    label: `${t(p.nameKey)} · ${t("flow_loan_per", { amount: fmt(p.installment), count: p.count })}`,
    plan: p,
  }));
  askChips(t("flow_loan_view_plans"), options, (opt)=> showLoanPlanConfirm(opt.plan));
}

function showLoanPlanConfirm(plan){
  const L = state.loan;
  addAssistantHTML(`
    <div class="card">
      <div class="card-title"><div class="av">${ICONS.loan}</div><div><b>${t(plan.nameKey)}</b><small style="color:var(--jc-red); font-weight:800;">${t(plan.tagKey)}</small></div></div>
      <div class="card-row"><span class="k">${t("flow_loan_due")}</span><span class="v">${t("flow_loan_per", { amount: fmt(plan.installment), count: plan.count })}</span></div>
      <div class="card-row"><span class="k">${t("flow_loan_total")}</span><span class="v">${fmt(plan.totalPayable)}</span></div>
      <div class="card-row"><span class="k">${t("flow_loan_outstanding")}</span><span class="v">${fmt(L.outstanding + L.lateFees)}</span></div>
      <div class="btn-row">
        <button class="btn primary" onclick="approveAction(this,'loan_plan', ${JSON.stringify({planId:plan.id,name:t(plan.nameKey),installment:plan.installment}).replace(/"/g,'&quot;')})">${t("flow_loan_select_plan")}</button>
        <button class="btn outline" onclick="cancelAction(this)">${t("flow_cancel")}</button>
      </div>
    </div>`);
}

function askLoanPayAmount(){
  refreshLoanPlans();
  const L = state.loan;
  const minPlan = L.plans.find(p => p.id === "min");
  const full = L.outstanding + L.lateFees;
  askChips(t("flow_loan_pay_ask"), [
    {label:t("flow_loan_pay_min", { amount: fmt(minPlan.installment) }), amount: minPlan.installment},
    {label:t("flow_loan_pay_next", { amount: fmt(L.nextInstallment) }), amount: L.nextInstallment},
    {label:t("flow_loan_pay_full", { amount: fmt(full) }), amount: full},
    {label:t("flow_loan_pay_other"), other:true},
  ], (opt)=>{
    if(opt.other){
      askText(t("flow_loan_pay_ask"), (txt)=>{
        const m = txt.match(/[\d,]+/);
        showLoanPayConfirm(m ? parseInt(m[0].replace(/,/g,""), 10) : L.nextInstallment);
      }, "e.g. 2500");
    } else showLoanPayConfirm(opt.amount);
  });
}

function showLoanPayConfirm(amount){
  const L = state.loan;
  const resulting = state.balance - amount;
  addAssistantHTML(`<div class="bubble">${t("flow_loan_confirm")}</div>`);
  addAssistantHTML(`
    <div class="card">
      <div class="card-title"><div class="av">${ICONS.loan}</div><div><b>${L.product}</b><small style="color:var(--muted); font-weight:500;">${loanDueLabel()}</small></div></div>
      <div class="card-row"><span class="k">${t("flow_amount")}</span><span class="v">${fmt(amount)}</span></div>
      <div class="card-row"><span class="k">${t("flow_loan_outstanding")}</span><span class="v">${fmt(L.outstanding + L.lateFees)}</span></div>
      <div class="card-row"><span class="k">${t("flow_balance_after")}</span><span class="v">${fmt(resulting)}</span></div>
      <div class="btn-row">
        <button class="btn primary" onclick="approveAction(this,'loan_pay', ${JSON.stringify({amount}).replace(/"/g,'&quot;')})">${t("flow_loan_approve", { amount: fmt(amount) })}</button>
        <button class="btn outline" onclick="cancelAction(this)">${t("flow_cancel")}</button>
      </div>
    </div>`);
}

function explainLoanFees(){
  const L = state.loan;
  const behind = L.behind
    ? t("flow_loan_behind_clause", { days: L.daysBehind })
    : t("flow_loan_on_time_clause");
  addAssistantHTML(`<div class="bubble">${t("flow_loan_fees_explain", {
    fee: fmt(L.lateFeePerDay),
    accrued: fmt(L.lateFees),
    behind,
  })}</div>`);
  askChips(t("flow_loan_ask"), [
    {label:t("flow_loan_view_plans"), action:"plans"},
    {label:t("flow_loan_pay"), action:"pay"},
    {label:t("flow_later"), action:"later"},
  ], (opt)=>{
    if(opt.action==="plans") return showLoanPlans();
    if(opt.action==="pay") return askLoanPayAmount();
    addAssistantHTML(`<div class="bubble">${jcReplyLanguage==="urdu"?"ٹھیک ہے — قرضہ واجبات قریب آنے پر یاد دلائیں گے۔":"Okay — I'll nudge you again closer to the due date."}</div>`);
  });
}

/* ---------- shared approve/cancel handling ---------- */
function cancelAction(btn){
  const card = btn.closest(".card");
  card.innerHTML = `<div style="text-align:center; color:var(--muted); padding:6px 0;">No action taken — you can always ask again later.</div>`;
}
function approveAction(btn, type, payload){
  const card = btn.closest(".card");
  card.innerHTML = `<div style="display:flex; align-items:center; gap:8px; padding:6px 0; color:var(--muted);"><div class="typing"><span></span><span></span><span></span></div> Working on it…</div>`;
  setTimeout(()=>{
    let title, sub;
    if(type==="send"){ state.balance -= (payload.amount+payload.fee); state.totalSent += payload.amount; title="Sent!"; sub=`${fmt(payload.amount)} sent to ${payload.name}.`; state.txns.unshift({type:"send",title:"Sent to "+payload.name,sub:"P2P transfer",amount:payload.amount,sign:"-",ok:true,when:"Just now"}); }
    if(type==="bill"){ state.balance -= payload.amount; state.totalSent += payload.amount; title="Bill Paid!"; sub=`${payload.name} bill of ${fmt(payload.amount)} paid.`; state.txns.unshift({type:"bill",title:payload.name+" Bill",sub:"Utility payment",amount:payload.amount,sign:"-",ok:true,when:"Just now"}); }
    if(type==="topup"){ state.balance -= payload.amount; state.totalSent += payload.amount; title="Activated!"; sub=`${payload.name} activated on your number.`; state.txns.unshift({type:"topup",title:payload.name,sub:"Mobile top-up",amount:payload.amount,sign:"-",ok:true,when:"Just now"}); }
    if(type==="addmoney"){ state.balance += payload.amount; state.totalReceived += payload.amount; title="Money Added!"; sub=`${fmt(payload.amount)} added via ${payload.name}.`; state.txns.unshift({type:"credit",title:"Wallet top-up via "+payload.name,sub:"Bank transfer in",amount:payload.amount,sign:"+",ok:true,when:"Just now"}); }
    if(type==="loan_plan"){
      state.loan.selectedPlanId = payload.planId;
      state.loan.nextInstallment = payload.installment;
      title = jcReplyLanguage==="urdu" ? "منصوبہ اپڈیٹ!" : "Plan updated!";
      sub = t("flow_loan_plan_set", { plan: payload.name, amount: fmt(payload.installment) }).replace(/<\/?b>/g,"");
      card.innerHTML = `<div class="success-box"><div class="success-check">\u2713</div><b>${title}</b><span style="color:var(--muted); font-size:12px;">${t("flow_loan_plan_set", { plan: payload.name, amount: fmt(payload.installment) })}</span></div>`;
      askChips(t("flow_loan_ask"), [
        {label:t("flow_loan_pay"), action:"pay"},
        {label:t("flow_later"), action:"later"},
      ], (opt)=>{ if(opt.action==="pay") askLoanPayAmount(); });
      renderAll(); scrollChat(); return;
    }
    if(type==="loan_pay"){
      const L = state.loan;
      const payAmt = payload.amount;
      let remaining = payAmt;
      const feePay = Math.min(L.lateFees, remaining);
      L.lateFees -= feePay;
      remaining -= feePay;
      L.outstanding = Math.max(0, L.outstanding - remaining);
      if(L.outstanding === 0){ L.lateFees = 0; L.behind = false; L.daysBehind = 0; L.dueInDays = 0; }
      else if(feePay > 0 || payAmt >= L.nextInstallment){
        L.behind = false;
        L.daysBehind = 0;
        L.dueInDays = L.dueInDays > 0 ? L.dueInDays : 30;
      }
      state.balance -= payAmt;
      state.totalSent += payAmt;
      refreshLoanPlans();
      title = t("flow_loan_paid");
      sub = t("flow_loan_paid_sub", { amount: fmt(payAmt) });
      state.txns.unshift({type:"bill",title:"Ready Cash repayment",sub:"Loan installment",amount:payAmt,sign:"-",ok:true,when:"Just now"});
    }
    card.innerHTML = `<div class="success-box"><div class="success-check">\u2713</div><b>${title}</b><span style="color:var(--muted); font-size:12px;">${sub}</span></div>`;
    renderAll();
    scrollChat();
  }, 900);
}

/* ---------- personalized offer redemption ---------- */
function redeemOffer(offer, rid){
  const row = document.getElementById(rid); if(row) row.remove();
  addUser("Get the code");
  afterDelay(()=>{
    const code = promoCode();
    addAssistantHTML(`
      <div class="card">
        <div class="card-title"><div class="av">${offer.ico}</div><div><b>${offer.merchant}</b><small style="color:var(--muted); font-weight:500;">${offer.discount}</small></div></div>
        <div class="promo-code">${code}</div>
      </div>`);
  });
}

/* ============================================================
   PROACTIVE + SELF-HEALING ENGINE (debounced, no overlap)
   ============================================================ */
function updateBadge(n){
  state.badge = n;
  document.getElementById("tab-dot").style.display = n>0 ? "block" : "none";
}

const NUDGE_CONTENT = {
  bill: ()=>{
    const b = state.flaggedBiller;
    return { kind:"proactive", title:"Bill due soon", sub:`${b.name} · ${fmt(b.amount)} due in ${b.dueInDays} day(s)`,
      toast:`Your ${b.name} bill of ${fmt(b.amount)} is due in ${b.dueInDays} days — about ${fmt(b.increase)} higher than usual. Want me to prepare the payment?`,
      action:()=> askChips("Want me to prepare that payment?", [{label:"Yes, pay now", biller:b},{label:"Remind me later", later:true}], (opt)=>{
        if(opt.later) return addAssistantHTML(`<div class="bubble">Sure, I'll remind you again closer to the due date.</div>`);
        startBill(opt.biller);
      }) };
  },
  topup: ()=>({ kind:"proactive", title:"Package expiring", sub:`${state.pkg.name} expires in ${state.topupExpiresHours}h`,
    toast:`Your ${state.pkg.name} expires in ${state.topupExpiresHours} hours. Renew for ${fmt(state.pkg.price)}?`,
    action:()=> showTopupConfirm(state.pkg) }),
  recovery: ()=>({ kind:"proactive", title:"Payment needs attention", sub:`Transfer to ${state.failedTxn.title} failed`,
    toast:`Your payment to ${state.failedTxn.title} failed, but ${fmt(state.failedTxn.amount)} was not deducted. Want me to explain what happened?`,
    action:()=> explainFailure() }),
  offer: ()=>{
    const o = pick(state.offers);
    return { kind:"proactive", title:"Personalized offer", sub:`${o.merchant} · ${o.discount}`,
      toast:`${o.ico} ${o.reason} — here's ${o.discount.toLowerCase()} at ${o.merchant}. Want the code?`,
      action:()=>{
        state.convo.chipRowCounter++;
        const rid = "chiprow"+state.convo.chipRowCounter;
        addAssistantHTML(`<div class="inline-chip-row" id="${rid}"><button class="inline-chip" onclick="redeemOffer(${JSON.stringify(o).replace(/"/g,'&quot;')}, '${rid}')">Get the code</button></div>`);
      } };
  },
  selfheal: ()=>{
    const options = [
      { issue:"a duplicate top-up request", fix:"blocked the second attempt automatically" },
      { issue:"a delayed balance sync after your last transfer", fix:"refreshed it in the background" },
      { issue:"a stuck pending status on a completed bill payment", fix:"cleared it automatically" },
    ];
    const pickIssue = pick(options);
    return { kind:"heal", title:"Self-healed automatically", sub:pickIssue.issue,
      toast:`\u{1FA7A} I noticed ${pickIssue.issue} and ${pickIssue.fix}. Your account is correct — no action needed.`,
      action:()=> addAssistantHTML(`<div class="bubble">Just so you know: I can only auto-fix read-only issues like sync glitches or duplicate blocks. Anything that moves your money will always wait for your approval first.</div>`) };
  },
  loan: ()=>{
    const L = state.loan || makeDemoLoan();
    state.loan = L;
    const dueTxt = L.behind
      ? (jcReplyLanguage==="urdu"
          ? `آپ کی Ready Cash قسط ${L.daysBehind} دن لیٹ ہے — ${fmt(L.lateFees)} لیٹ فیس جمع ہو چکی ہے (${fmt(L.lateFeePerDay)}/دن)۔`
          : `Your Ready Cash installment is ${L.daysBehind} day(s) late — ${fmt(L.lateFees)} in late fees so far (${fmt(L.lateFeePerDay)}/day).`)
      : (jcReplyLanguage==="urdu"
          ? `آپ کی Ready Cash قسط ${L.dueInDays} دن میں واجب ہے — ${fmt(L.nextInstallment)}۔`
          : `Your Ready Cash installment of ${fmt(L.nextInstallment)} is due in ${L.dueInDays} day(s).`);
    const toast = jcReplyLanguage==="urdu"
      ? `${dueTxt} ادائیگی کا منصوبہ دیکھیں یا ابھی ادا کریں؟`
      : `${dueTxt} Want to review payment plans or pay now?`;
    return {
      kind:"proactive",
      title: L.behind ? (jcReplyLanguage==="urdu"?"قرضہ تاخیر میں":"Loan payment overdue") : (jcReplyLanguage==="urdu"?"قرضہ واجب قریب":"Loan payment due soon"),
      sub: `${L.product} · ${fmt(L.outstanding + L.lateFees)}`,
      toast,
      action:()=> askChips(t("flow_loan_ask"), [
        {label:t("flow_loan_view_plans"), action:"plans"},
        {label:t("flow_loan_pay"), action:"pay"},
        {label:t("flow_loan_explain"), action:"fees"},
      ], (opt)=>{
        if(opt.action==="plans") return showLoanPlans();
        if(opt.action==="pay") return askLoanPayAmount();
        if(opt.action==="fees") return explainLoanFees();
      }),
    };
  },
};
let pendingNudgeAction = null;
let nudgeCooldown = false;
const NUDGE_BTN_IDS = ["nb-bill","nb-topup","nb-recovery","nb-offer","nb-heal","nb-loan"];

function setNudgeButtonsEnabled(enabled){
  NUDGE_BTN_IDS.forEach(id=>{ const b=document.getElementById(id); if(b) b.disabled = !enabled; });
}

function showToast(text, kind){
  const t = document.getElementById("toast");
  t.className = "toast" + (kind==="heal" ? " heal" : "");
  t.innerHTML = `<div class="ic">${kind==="heal" ? "\u{1FA7A}" : "\u{1F514}"}</div><div><b>JazzCash Assistant</b><span>${text}</span></div>`;
  t.classList.add("show");
  t.onclick = ()=>{ t.classList.remove("show"); openAssistant(); };
  setTimeout(()=> t.classList.remove("show"), 4200);
}
function showNudgeBanner(n){
  document.getElementById("nudge-title").textContent = n.title;
  document.getElementById("nudge-sub").textContent = n.sub;
  document.getElementById("home-nudge").classList.add("show");
}
function hideNudgeBanner(){ document.getElementById("home-nudge").classList.remove("show"); }
function openNudgeFromBanner(){ openAssistant(); runPendingNudgeAction(); }
function runPendingNudgeAction(){ if(pendingNudgeAction){ const fn = pendingNudgeAction; pendingNudgeAction = null; fn(); } }

function fireNudge(kind){
  if(nudgeCooldown) return; // prevents back-to-back overlapping triggers
  nudgeCooldown = true;
  setNudgeButtonsEnabled(false);

  const n = NUDGE_CONTENT[kind]();
  pendingNudgeAction = n.action;
  showToast(n.toast, n.kind);
  if(n.kind==="proactive"){ showNudgeBanner(n); updateBadge(state.badge + 1); }
  addAssistantHTML(`<div class="bubble">${n.toast}</div>`, n.kind);

  state.convo.chipRowCounter++;
  const rid = "chiprow"+state.convo.chipRowCounter;
  const label = n.kind==="heal" ? "Got it, thanks" : "Let's handle it";
  document.getElementById("chat-log").insertAdjacentHTML("beforeend",
    `<div class="msg-row assistant"><div class="msg-avatar" style="visibility:hidden;">JC</div><div class="msg-body"><div class="inline-chip-row" id="${rid}"><button class="inline-chip" onclick="document.getElementById('${rid}').remove(); runPendingNudgeAction();">${label}</button></div></div></div>`);
  scrollChat();

  setTimeout(()=>{ nudgeCooldown = false; setNudgeButtonsEnabled(true); }, 3200);
}

/* ============================================================
   INIT
   ============================================================ */
function init(){
  generateDemoData();
  renderAll();
  syncLangToggleUI();
  seedGreeting();
  const now = new Date();
  document.getElementById("clock").textContent = now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}
init();
</script>
