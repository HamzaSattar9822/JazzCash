<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JazzCash Assistant — Conversational Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --jc-red:#A6081C;
    --jc-red-dark:#6E0512;
    --jc-red-tint:#FBE7E9;
    --jc-gold:#F5C518;
    --jc-gold-dark:#8A6100;
    --jc-gold-tint:#FDECC8;
    --ink:#181818;
    --muted:#6B7280;
    --line:#ECECEE;
    --page:#EDEEF1;
    --white:#FFFFFF;
    --success:#1E8E3E;
    --success-tint:#E8F7EC;
    --warn-tint:#FFF6E5;
    --heal-tint:#E7F6EE;
    --heal-dark:#146C43;
    --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:var(--font); background:var(--page); display:flex; flex-direction:column; align-items:center; gap:14px; min-height:100vh; padding:28px 16px 60px; color:var(--ink); }
  .layout{ display:flex; align-items:flex-start; justify-content:center; gap:20px; flex-wrap:wrap; }

  /* ---------- side demo panel ---------- */
  .demo-bar{ width:220px; background:var(--ink); color:#fff; border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:10px; font-size:12px; }
  .demo-bar b{font-weight:700; color:var(--jc-gold); letter-spacing:.02em; display:block; font-size:12.5px; margin-bottom:2px;}
  .demo-bar .demo-hint{ font-size:11px; color:#ADADB2; line-height:1.45; margin-bottom:4px; }
  .demo-actions{ display:flex; flex-direction:column; gap:7px; }
  .demo-btn{ background:#2c2c2c; color:#fff; border:1px solid #3d3d3d; border-radius:8px; padding:9px 11px; font-size:12px; font-family:var(--font); cursor:pointer; text-align:left; width:100%; transition:opacity .2s; }
  .demo-btn:hover{background:#3a3a3a;}
  .demo-btn:disabled{ opacity:.35; cursor:not-allowed; }

  /* ---------- phone ---------- */
  .phone{ width:390px; height:844px; max-width:100%; background:var(--white); border-radius:38px; box-shadow:0 30px 60px -20px rgba(0,0,0,.35), 0 0 0 10px #0c0c0e; overflow:hidden; position:relative; display:flex; flex-direction:column; }
  .notch{ position:absolute; top:0; left:50%; transform:translateX(-50%); width:120px; height:22px; background:#0c0c0e; border-radius:0 0 14px 14px; z-index:50; }
  .status-row{ display:flex; justify-content:space-between; align-items:center; padding:14px 20px 4px; font-size:12px; font-weight:600; flex-shrink:0; }

  .screens{ flex:1; min-height:0; position:relative; }
  .screen{ position:absolute; inset:0; overflow-y:auto; display:none; padding-bottom:16px; }
  .screen.active{ display:block; }
  .screen::-webkit-scrollbar{ display:none; }

  .app-header{ display:flex; align-items:center; justify-content:space-between; padding:14px 20px 14px; flex-shrink:0; }
  .brand{ display:flex; align-items:center; gap:7px; }
  .brand img{ height:24px; }
  .brand-fallback{ font-weight:800; font-size:19px; letter-spacing:-.02em; }
  .brand-fallback .jazz{ color:var(--ink); } .brand-fallback .cash{ color:var(--jc-red); }
  .icon-btn{ width:36px; height:36px; border-radius:50%; background:#F1F1F3; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#555; border:none; flex-shrink:0; }
  .icon-btn svg{ width:17px; height:17px; }

  .balance-card{ margin:0 20px 14px; padding:20px; border-radius:20px; color:#fff; background:radial-gradient(120% 130% at 85% -10%, #D4132A 0%, var(--jc-red) 42%, var(--jc-red-dark) 100%); position:relative; overflow:hidden; }
  .balance-label{ font-size:12px; opacity:.85; font-weight:500; }
  .balance-amount{ font-size:29px; font-weight:800; margin:4px 0 14px; letter-spacing:-.02em; }
  .balance-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .add-money-btn{ background:var(--jc-gold); color:#4A3300; border:none; padding:10px 16px; border-radius:22px; font-size:12.5px; font-weight:800; font-family:var(--font); cursor:pointer; display:flex; align-items:center; gap:6px; }
  .add-money-btn:hover{ filter:brightness(0.96); }
  .masked-card-text{ font-size:11.5px; color:rgba(255,255,255,.85); font-weight:500; }

  .quick-row{ display:flex; justify-content:space-between; padding:4px 20px 20px; }
  .quick-item{ display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; width:58px; }
  .quick-icon{ width:52px; height:52px; border-radius:50%; background:var(--jc-red-tint); display:flex; align-items:center; justify-content:center; color:var(--jc-red); }
  .quick-icon svg{ width:21px; height:21px; }
  .quick-item span{ font-size:10.5px; font-weight:600; text-align:center; color:var(--ink); line-height:1.2; }

  .offers-wrap{ padding:0 0 18px; }
  .offers-scroll{ display:flex; gap:10px; overflow-x:auto; padding:0 20px 4px; scrollbar-width:none; }
  .offers-scroll::-webkit-scrollbar{ display:none; }
  .offer-card{ flex:0 0 auto; width:210px; background:linear-gradient(135deg,#FFF8E6,#FFF1CC); border:1px solid #F2DFA0; border-radius:16px; padding:12px 13px; }
  .offer-card .row1{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .offer-card .ico{ width:30px; height:30px; border-radius:9px; background:#fff; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
  .offer-card b{ font-size:12.5px; }
  .offer-card .disc{ font-size:11.5px; font-weight:800; color:var(--jc-red-dark); display:block; }
  .offer-card .reason{ font-size:10.5px; color:var(--muted); line-height:1.3; margin-top:3px; }

  .nudge-banner{ margin:0 20px 16px; background:var(--warn-tint); border:1px solid #F3DFA6; border-radius:14px; padding:12px 14px; display:none; gap:10px; align-items:flex-start; cursor:pointer; }
  .nudge-banner.show{ display:flex; }
  .nudge-banner .ic{ font-size:18px; }
  .nudge-banner .txt b{ display:block; font-size:12.5px; margin-bottom:2px; }
  .nudge-banner .txt span{ font-size:12px; color:var(--muted); }

  .section-label{ padding:0 20px 10px; font-size:13.5px; font-weight:700; display:flex; justify-content:space-between; align-items:center; }
  .section-label a{ font-size:11.5px; color:var(--jc-red); font-weight:600; text-decoration:none; }

  .txn-list{ padding:0 20px; display:flex; flex-direction:column; gap:9px; }
  .txn{ display:flex; align-items:center; gap:12px; padding:12px 13px; cursor:pointer; background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:0 1px 2px rgba(16,16,18,.04); transition:box-shadow .15s ease, transform .15s ease; }
  .txn:hover{ box-shadow:0 4px 12px rgba(16,16,18,.08); transform:translateY(-1px); }
  .txn.is-fail{ background:var(--jc-red-tint); border-color:#F0CACD; }
  .txn-icon{ width:38px; height:38px; border-radius:50%; background:#F1F1F3; display:flex; align-items:center; justify-content:center; color:var(--jc-red); flex-shrink:0; }
  .txn-icon svg{ width:16px; height:16px; }
  .txn-icon.fail{ background:#F6D9DC; }
  .txn-icon.credit{ background:var(--success-tint); color:var(--success); }
  .txn-body{ flex:1; min-width:0; }
  .txn-title{ font-size:13px; font-weight:600; }
  .txn-sub{ font-size:11.5px; color:var(--muted); margin-top:1px; }
  .txn-hint{ font-size:11px; color:var(--jc-red); font-weight:700; margin-top:2px; }
  .txn-amt{ font-size:13px; font-weight:700; white-space:nowrap; text-align:right; }
  .txn-amt.debit{ color:var(--ink); }
  .txn-amt.credit{ color:var(--success); }
  .txn-amt.fail{ color:var(--jc-red); }
  .txn-status{ font-size:10px; font-weight:700; margin-top:3px; text-align:right; }
  .txn-status.ok{ color:var(--success); }
  .txn-status.bad{ color:var(--jc-red); }
  .list-tip{ margin:14px 20px 0; font-size:11.5px; color:var(--muted); }
  /* ---------- loan repayment add-on ---------- */
  .loan-plan{ border:1px solid var(--line); border-radius:12px; padding:11px; margin-top:8px; background:#fff; cursor:pointer; }
  .loan-plan:hover{ border-color:#D9C4C8; }
  .loan-plan.selected{ border:2px solid var(--jc-red); background:var(--jc-red-tint); padding:10px; }
  .loan-plan b{ font-size:12px; }
  .loan-plan small{ display:block; color:var(--muted); font-size:10.5px; margin-top:2px; line-height:1.3; }
  .loan-plan-row{ display:flex; justify-content:space-between; gap:8px; margin-top:7px; font-size:10.5px; font-weight:700; }
  .loan-note{ font-size:10.5px; color:var(--muted); margin-top:8px; line-height:1.35; }
  .home-loan-card{ margin:12px 20px 0; border:1px solid #E9D8DB; border-radius:14px; background:#FFF9FA; padding:13px; cursor:pointer; box-shadow:0 3px 10px rgba(90,0,14,.04); }
  .home-loan-card:hover{ border-color:#D9C4C8; }
  .home-loan-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .home-loan-title{ display:flex; align-items:center; gap:9px; min-width:0; }
  .home-loan-icon{ width:34px; height:34px; border-radius:10px; background:#fff; border:1px solid #EADBDD; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:17px; }
  .home-loan-title b{ display:block; font-size:12.5px; }
  .home-loan-title span{ display:block; color:var(--muted); font-size:10.5px; margin-top:2px; }
  .home-loan-status{ font-size:10px; font-weight:800; padding:5px 7px; border-radius:999px; background:#F2F5F3; color:#317354; white-space:nowrap; }
  .home-loan-status.warning{ background:#FFF1D7; color:#9A6200; }
  .home-loan-status.danger{ background:#FDE8EB; color:#A6081C; }
  .home-loan-main{ display:flex; justify-content:space-between; gap:12px; margin-top:12px; }
  .home-loan-main .amt{ font-size:18px; font-weight:800; line-height:1.05; }
  .home-loan-main .meta{ font-size:10.5px; color:var(--muted); margin-top:3px; }
  .home-loan-arrow{ align-self:center; color:var(--jc-red); font-weight:800; font-size:16px; }
  .home-loan-progress{ height:6px; border-radius:99px; background:#F0E4E6; margin-top:11px; overflow:hidden; }
  .home-loan-progress > div{ height:100%; background:var(--jc-red); border-radius:99px; transition:width .3s ease; }
  .home-loan-foot{ display:flex; justify-content:space-between; gap:8px; margin-top:8px; font-size:10px; color:var(--muted); }

  /* ---------- tab bar ---------- */
  .tabbar{ position:relative; flex-shrink:0; height:74px; background:#fff; border-top:1px solid var(--line); display:flex; padding-bottom:12px; z-index:40; }
  .tab{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; cursor:pointer; color:#9CA0A6; font-size:10.5px; font-weight:600; position:relative; background:none; border:none; font-family:var(--font); }
  .tab svg{ width:19px; height:19px; }
  .tab.active{ color:var(--jc-red); }
  .tab .tab-dot{ position:absolute; top:2px; right:26%; width:8px; height:8px; background:var(--jc-red); border-radius:50%; border:2px solid #fff; display:none; }

  /* ---------- floating assistant button ---------- */
  .fab{ position:absolute; right:18px; bottom:90px; width:56px; height:56px; border-radius:50%; background:var(--jc-red); box-shadow:0 10px 24px -6px rgba(166,8,28,.55); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:45; border:none; }
  .fab svg{ width:24px; height:24px; }

  /* ---------- toast ---------- */
  .toast{ position:absolute; top:16px; left:14px; right:14px; background:var(--ink); color:#fff; border-radius:13px; padding:11px 13px; display:flex; gap:10px; align-items:flex-start; box-shadow:0 12px 24px rgba(0,0,0,.25); transform:translateY(-120px); transition:transform .35s ease; z-index:90; cursor:pointer; }
  .toast.show{ transform:translateY(0); }
  .toast .ic{ font-size:16px; }
  .toast b{ display:block; font-size:12px; color:var(--jc-gold); margin-bottom:2px; }
  .toast span{ font-size:12px; line-height:1.35; color:#eee; }
  .toast.heal b{ color:#8FE0B4; }

  /* ---------- assistant bottom sheet ---------- */
  .sheet-overlay{ position:absolute; inset:0; background:rgba(0,0,0,.35); z-index:60; opacity:0; pointer-events:none; transition:opacity .25s ease; }
  .sheet-overlay.show{ opacity:1; pointer-events:auto; }
  .sheet{ position:absolute; left:0; right:0; bottom:0; height:88%; background:#fff; border-radius:22px 22px 0 0; z-index:70; transform:translateY(100%); transition:transform .32s cubic-bezier(.32,.72,0,1); display:flex; flex-direction:column; box-shadow:0 -10px 30px rgba(0,0,0,.2); }
  .sheet.show{ transform:translateY(0); }
  /* Keep sheet header language toggle always tappable above chat content */
  .sheet-header{ position:relative; z-index:2; }
  .sheet-header-actions .lang-toggle{ position:relative; z-index:3; }
  .sheet-handle{ width:40px; height:4px; background:#DDD; border-radius:3px; margin:10px auto 4px; flex-shrink:0; }
  .sheet-header{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 14px 12px; border-bottom:1px solid var(--line); flex-shrink:0; }
  .sheet-header .who{ display:flex; align-items:center; gap:9px; min-width:0; flex:1; }
  .sheet-avatar{ width:34px; height:34px; border-radius:50%; background:var(--jc-red); color:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; flex-shrink:0; }
  .sheet-header h3{ margin:0; font-size:14px; line-height:1.25; display:flex; flex-wrap:wrap; align-items:center; gap:4px; }
  .sheet-header p{ margin:2px 0 0; font-size:11px; color:var(--muted); font-weight:500; line-height:1.35; }
  .sheet-close{ width:30px; height:30px; border-radius:50%; background:#F5F5F6; border:none; font-size:14px; cursor:pointer; color:var(--muted); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .sheet-close svg{ width:14px; height:14px; }
  .sheet-header-actions{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .lang-toggle{ display:flex; background:#F2F2F4; border-radius:999px; padding:3px; gap:2px; border:1px solid var(--line); }
  .lang-toggle button{ border:none; background:transparent; border-radius:999px; padding:6px 10px; font-size:11px; font-weight:800; font-family:var(--font); color:var(--muted); cursor:pointer; line-height:1; position:relative; z-index:2; -webkit-tap-highlight-color:transparent; }
  .lang-toggle button.active{ background:var(--jc-red); color:#fff; box-shadow:0 2px 6px rgba(166,8,28,.25); }
  .lang-toggle button[data-lang="urdu"]{ font-family:'Noto Nastaliq Urdu',Inter,sans-serif; font-size:11px; }
  .header-lang{ position:relative; z-index:5; flex-shrink:0; }
  .ai-badge{ font-size:10px; font-weight:700; color:var(--jc-red-dark); background:var(--jc-red-tint); padding:2px 8px; border-radius:999px; white-space:nowrap; }

  .chat-log{ flex:1; min-height:0; overflow-y:auto; padding:14px 14px 8px; display:flex; flex-direction:column; gap:10px; }
  .chat-log::-webkit-scrollbar{ display:none; }
  .msg-row{ display:flex; gap:8px; width:100%; max-width:100%; align-items:flex-start; box-sizing:border-box; }
  .msg-row.user{ justify-content:flex-end; }
  .msg-row.assistant{ justify-content:flex-start; }
  .msg-avatar{ width:26px; height:26px; border-radius:50%; background:var(--jc-red); color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:2px; }
  .msg-body{ display:flex; flex-direction:column; align-items:stretch; gap:8px; flex:1; min-width:0; max-width:calc(100% - 34px); }
  .msg-row.user .msg-body{ flex:0 1 auto; max-width:82%; align-items:flex-end; }
  .bubble{ width:fit-content; max-width:100%; padding:10px 13px; border-radius:15px; font-size:13px; line-height:1.5; word-break:break-word; box-sizing:border-box; }
  .msg-row.assistant .bubble{ background:#F2F2F4; border-top-left-radius:4px; align-self:flex-start; }
  .msg-row.assistant .bubble b{ color:var(--jc-red-dark); }
  .msg-row.user .bubble{ background:var(--jc-red); color:#fff; border-top-right-radius:4px; max-width:100%; }
  .proactive-tag, .heal-tag{ font-size:9.5px; font-weight:800; padding:2px 7px; border-radius:20px; display:inline-block; letter-spacing:.02em; align-self:flex-start; }
  .proactive-tag{ color:var(--jc-red-dark); background:var(--jc-red-tint); }
  .heal-tag{ color:var(--heal-dark); background:var(--heal-tint); }

  .inline-chip-row{ display:flex; flex-wrap:wrap; gap:7px; width:100%; max-width:100%; margin:0; padding:0; box-sizing:border-box; align-items:stretch; }
  .inline-chip{ background:#fff; border:1.5px solid var(--jc-red); color:var(--jc-red-dark); border-radius:14px; padding:8px 13px; font-size:12px; font-weight:700; cursor:pointer; font-family:var(--font); white-space:normal; overflow-wrap:anywhere; word-break:break-word; text-align:center; line-height:1.25; min-height:34px; max-width:100%; flex:0 1 auto; box-sizing:border-box; }
  .inline-chip:hover{ background:var(--jc-red-tint); }

  .card{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:13px; width:100%; max-width:100%; font-size:12.5px; box-sizing:border-box; align-self:stretch; }
  .card-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:6px 0; font-size:12.5px; }
  .card-row .k{ color:var(--jc-gold-dark); font-weight:600; flex:1; min-width:0; line-height:1.4; }
  .card-row .v{ font-weight:700; text-align:right; flex-shrink:0; line-height:1.4; }
  .card-title{ display:flex; align-items:center; gap:9px; margin-bottom:8px; }
  .card-title > div:last-child{ min-width:0; flex:1; }
  .card-title .av{ width:34px; height:34px; border-radius:50%; background:var(--jc-gold-tint); color:var(--jc-gold-dark); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex-shrink:0; overflow:hidden; }
  .card-title .av svg{ width:16px; height:16px; display:block; }
  .card-title b{ font-size:13.5px; display:block; line-height:1.3; }
  .card-title small{ color:var(--success); font-size:11px; font-weight:600; display:block; line-height:1.35; margin-top:2px; }
  .card hr{ border:none; border-top:1px dashed var(--line); margin:8px 0; }
  .flag{ background:var(--warn-tint); color:#8a6100; font-size:11px; font-weight:600; padding:6px 9px; border-radius:9px; margin:8px 0; }
  .btn-row{ display:flex; gap:8px; margin-top:11px; min-width:0; width:100%; align-items:stretch; }
  @media (max-width:360px){ .btn-row{ flex-direction:column; } }
  .btn{ flex:1 1 0; min-width:0; min-height:38px; padding:9px 12px; border-radius:14px; font-size:12.5px; font-weight:700; border:none; cursor:pointer; font-family:var(--font); white-space:normal; overflow-wrap:anywhere; word-break:break-word; text-align:center; line-height:1.25; display:inline-flex; align-items:center; justify-content:center; box-sizing:border-box; }
  .btn.primary{ background:var(--jc-red); color:#fff; }
  .btn.primary:hover{ background:var(--jc-red-dark); }
  .btn.outline{ background:#fff; color:var(--ink); border:1.5px solid var(--line); }
  .btn.outline:hover{ background:#F7F7F8; }
  .fund-option{ display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 10px; border:1.5px solid var(--line); border-radius:11px; margin-bottom:7px; font-size:12px; box-sizing:border-box; }
  .fund-option.best{ border-color:var(--jc-red); background:var(--jc-red-tint); }
  .fund-option .tag{ font-size:9.5px; font-weight:800; color:var(--jc-red-dark); }
  .success-box{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:4px; padding:14px 8px 6px; width:100%; box-sizing:border-box; }
  .success-check{ width:44px; height:44px; border-radius:50%; background:var(--success-tint); color:var(--success); display:flex; align-items:center; justify-content:center; font-size:22px; margin-bottom:4px; }
  .promo-code{ margin-top:8px; background:var(--ink); color:var(--jc-gold); font-weight:800; letter-spacing:.06em; text-align:center; padding:9px 0; border-radius:9px; font-size:13.5px; }

  .chip-row{ display:flex; gap:7px; flex-wrap:nowrap; overflow-x:auto; padding:10px 14px; border-top:1px solid var(--line); flex-shrink:0; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .chip-row::-webkit-scrollbar{ display:none; }
  .chip{ background:#F2F2F4; border:1px solid var(--line); border-radius:14px; padding:8px 12px; font-size:11.5px; font-weight:600; cursor:pointer; color:var(--ink); white-space:nowrap; flex-shrink:0; line-height:1.25; min-height:34px; }
  .chip:hover{ background:#E9E9EB; }

  .composer{ display:flex; align-items:center; gap:8px; padding:10px 14px 16px; flex-shrink:0; }
  .composer input{ flex:1; min-width:0; border:1px solid var(--line); background:#F7F7F8; border-radius:22px; padding:11px 16px; font-size:13px; font-family:var(--font); outline:none; }

function pick(arr){ return arr[randInt(0,arr.length-1)]; }
function fmt(n){ return "Rs. " + Math.round(n).toLocaleString("en-PK"); }
function initials(name){ return name.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase(); }
function randomName(){ return pick(FIRST_NAMES) + " " + pick(LAST_NAMES); }
function randomPhone(){ return "03" + randInt(10,49) + "-" + randInt(1000000,9999999); }
function pad(n){ return String(n).padStart(2,"0"); }
function promoCode(){ return "JC" + Math.random().toString(36).slice(2,7).toUpperCase(); }

let state = {};

function generateDemoData(){
  const myName = randomName();
  const kycLevel = pick([1,2,2,3]);

  const usedFirst = new Set();
  const contacts = [];
  while(contacts.length < 6){
    const c = { name: randomName(), phone: randomPhone() };
    const first = c.name.split(" ")[0];
    if(usedFirst.has(first)) continue;
    usedFirst.add(first);
    contacts.push(c);
  }

  const billers = BILLERS.map(b => ({ ...b, amount: randInt(1500,9800), increase: randInt(150,900), dueInDays: randInt(1,6) }));
  const flaggedBiller = pick(billers);

  const pkg = pick(PACKAGES);
  const topupExpiresHours = randInt(6,30);

  const balance = randInt(18000, 62000);
  const last4 = String(randInt(1000,9999));

  const failedMerchant = pick(MERCHANTS);
  const failedAmount = randInt(500,4000);
  const salaryCompany = pick(COMPANIES);

  // Illustrative loan data for the prototype. Real fees/terms would come from the live lending system.
  const loanOriginal = randInt(15000,80000);
  const loanTermMonths = pick([3,6,9,12]);
  const loanFactor = pick([1.06,1.08,1.10]);
  const loanInstallment = Math.max(1000, Math.round((loanOriginal*loanFactor/loanTermMonths)/100)*100);
  const loanPaid = randInt(0, Math.max(0,loanTermMonths-1));
  const loanRemaining = Math.max(1,loanTermMonths-loanPaid);
  const loanOutstanding = Math.max(0,loanRemaining*loanInstallment);
  const loanStatus = pick(["On Track","On Track","Due Soon","Due Today","Behind"]);
  const loanOverdueDays = loanStatus==="Behind" ? randInt(2,18) : 0;
  const loanLateFee = loanStatus==="Behind" ? randInt(100,500) : 0;
  const loanDue = loanStatus==="Due Today"
    ? Date.now()+randInt(1,12)*60*60*1000
    : loanStatus==="Behind"
      ? Date.now()-loanOverdueDays*24*60*60*1000
      : Date.now()+randInt(1,5)*24*60*60*1000;
  const loan = { original:loanOriginal, termMonths:loanTermMonths, paid:loanPaid, remaining:loanRemaining, installment:loanInstallment, outstanding:loanOutstanding, status:loanStatus, overdueDays:loanOverdueDays, lateFee:loanLateFee, due:loanDue, selectedPlan:null, reminder:null };

  const offers = [OFFER_POOL[0], OFFER_POOL[1], OFFER_POOL[2], OFFER_POOL[3]]
    .sort(()=>Math.random()-0.5).slice(0,3)
    .map(o => ({ merchant:o.merchant, ico:o.ico, discount: pick(o.discounts), reason: pick(o.reasons) }));

  state = {
    myName, myPhone: randomPhone(), last4, kycLevel,
    balance, contacts, billers, flaggedBiller,
    pkg, topupExpiresHours, offers,
    totalSent: randInt(4000,15000), totalReceived: randInt(20000,60000),
    fundOptions: [
      {name:"Bank Transfer", fee:0, mins:"2-5 min"},
      {name:"Debit/Credit Card", fee:randInt(40,80), mins:"instant"},
      {name:"Agent Cash-In", fee:randInt(20,50), mins:"instant"},
    ],
    failedTxn: { title: failedMerchant, amount: failedAmount, deducted:false },
    loan,
    txns: [
      {type:"merchant", title:failedMerchant, sub:"Merchant payment", when:"Today, "+pad(randInt(7,11))+":"+pad(randInt(0,59)), amount:failedAmount, sign:"-", ok:false, hint:"Tap for help"},
      {type:"bill", title:flaggedBiller.name+" Bill", sub:"Utility payment", when:"Today, "+pad(randInt(7,11))+":"+pad(randInt(0,59)), amount:randInt(1500,9000), sign:"-", ok:true},
      {type:"credit", title:"Salary — "+salaryCompany, sub:"Bank transfer in", when:"Yesterday, "+pad(randInt(15,19))+":"+pad(randInt(0,59)), amount:randInt(35000,90000), sign:"+", ok:true},
      {type:"topup", title:pkg.name, sub:"Mobile top-up", when:pick(["Mon","Tue","2 days ago"])+", "+pad(randInt(9,13))+":"+pad(randInt(0,59)), amount:pkg.price, sign:"-", ok:true},
    ],
    badge: 0,
    convo: { pendingOptions: [], pendingResolver: null, pendingTextResolver: null, chipRowCounter: 0 },
  };
}

function renderAll(){
  document.getElementById("balance-amount").textContent = fmt(state.balance);
  document.getElementById("profile-name").textContent = state.myName;
  document.getElementById("profile-initials").textContent = initials(state.myName);
  document.getElementById("profile-balance").textContent = fmt(state.balance);

  document.getElementById("stat-received").textContent = fmt(state.totalReceived);
  renderTxns();
  renderOffers();
  renderHomeLoanCard();
  applyAppLanguage();
}

function renderOffers(){
  document.getElementById("offers-scroll").innerHTML = state.offers.map(o => `
    <div class="offer-card">
      <div class="row1"><div class="ico">${o.ico}</div><b>${o.merchant}</b></div>
      <span class="disc">${o.discount}</span>
      <div class="reason">${o.reason}</div>
    </div>`).join("");
}

function renderHomeLoanCard(){
  const card=document.getElementById("home-loan-card");
  if(!card || !state.loan) return;
  const l=state.loan;
  const paidPct = l.original > 0 ? Math.min(100, Math.max(0, ((l.original - l.outstanding) / l.original) * 100)) : 0;
  const statusEl=document.getElementById("home-loan-status");
  const rawStatus=l.outstanding<=0 ? "Paid Off" : l.status;
  const statusKey = ({
    "Paid Off":"loan_paid_off","On Track":"status_on_track","Due Soon":"status_due_soon",
    "Due Today":"status_due_today","Behind":"status_behind"
  })[rawStatus] || "status_on_track";
  statusEl.textContent=t(statusKey);
  statusEl.className="home-loan-status" + ((rawStatus==="Behind") ? " danger" : ((rawStatus==="Due Today" || rawStatus==="Due Soon") ? " warning" : ""));
  const planName=l.selectedPlan ? (l.selectedPlan.nameKey ? t(l.selectedPlan.nameKey) : l.selectedPlan.name) : t("loan_plan_current");
  document.getElementById("home-loan-plan-name").textContent=planName;
  document.getElementById("home-loan-installment").textContent=l.outstanding<=0 ? "Rs. 0" : fmt(l.installment);
  document.getElementById("home-loan-due").textContent=l.outstanding<=0 ? t("loan_fully_repaid") : t("loan_next_payment", { due: loanDueText("app") });
  document.getElementById("home-loan-progress-bar").style.width=paidPct.toFixed(1)+"%";
  document.getElementById("home-loan-remaining").textContent=l.outstanding<=0 ? t("loan_no_remaining") : t("loan_remaining", { n: l.remaining });
  document.getElementById("home-loan-outstanding").textContent=l.outstanding<=0 ? t("loan_fully_settled") : t("loan_outstanding", { amt: fmt(l.outstanding) });
}

const TYPE_ICON = {bill:"arrowUpRight", merchant:"arrowUpRight", topup:"arrowUpRight", send:"arrowUpRight", loan:"arrowUpRight", credit:"arrowDownLeft"};
function txnRow(txn){
  const clickAttr = (!txn.ok) ? "startRecoveryFor(event)" : "";
  const iconKey = TYPE_ICON[txn.type] || "arrowUpRight";
  const iconClass = !txn.ok ? "fail" : (txn.sign==="+" ? "credit" : "");
  const amtClass = !txn.ok ? "fail" : (txn.sign==="+" ? "credit" : "debit");
  const statusLabel = txn.ok ? t("status_ok") : t("status_fail");
  const hint = txn.hint ? t("hint_help") : "";
  return `<div class="txn ${!txn.ok?'is-fail':''}" onclick="${clickAttr}">
    <div class="txn-icon ${iconClass}">${ICONS[iconKey]}</div>
    <div class="txn-body">
      <div class="txn-title">${txn.title}</div>
      <div class="txn-sub">${txn.sub} · ${txn.when}</div>
      ${hint ? `<div class="txn-hint">${hint}</div>` : ""}
    </div>
    <div>
      <div class="txn-amt ${amtClass}">${txn.sign}${fmt(txn.amount)}</div>
      <div class="txn-status ${txn.ok?'ok':'bad'}">${statusLabel}</div>
    </div>
  </div>`;
}
function renderTxns(){
  document.getElementById("home-txns").innerHTML = state.txns.slice(0,4).map(txnRow).join("");
  document.getElementById("history-txns").innerHTML = state.txns.map(txnRow).join("");
}
function startRecoveryFor(ev){ if(ev) ev.stopPropagation(); openAssistant('recovery'); }
function profileToast(msg){ showToast(msg); }

let currentMainScreen = "home";
function showScreen(name){
  currentMainScreen = name;
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById("screen-"+name).classList.add("active");
  updateTabHighlight(name);
}
function updateTabHighlight(key){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active", t.dataset.tab===key));
}

  generateDemoData();
  renderAll();
  document.getElementById("chat-log").innerHTML = "";
  seedGreeting();
  hideNudgeBanner();
  updateBadge(0);
}

function openAssistant(intent){
  document.getElementById("sheet-overlay").classList.add("show");
  document.getElementById("sheet").classList.add("show");
  updateTabHighlight("assistant");
  updateBadge(0);
  hideNudgeBanner();
  if(intent) setTimeout(()=>quickStart(intent), 250);
}
function closeAssistant(){
  document.getElementById("sheet-overlay").classList.remove("show");
  document.getElementById("sheet").classList.remove("show");
  updateTabHighlight(currentMainScreen);
}

/* ---------- chat plumbing ---------- */
function scrollChat(){ const log=document.getElementById("chat-log"); log.scrollTop = log.scrollHeight; }
function addUser(text){
  document.getElementById("chat-log").insertAdjacentHTML("beforeend",
    `<div class="msg-row user"><div class="msg-body"><div class="bubble">${text}</div></div></div>`);
  scrollChat();
}
function addAssistantHTML(html, tagType){
  const tag = tagType==="proactive" ? `<div class="proactive-tag">${tc("proactive_tag")}</div>`
            : tagType==="heal" ? `<div class="heal-tag">${tc("heal_tag")}</div>` : "";
  // Auto-wrap plain text into a bubble
  let body = html;
  if(typeof html === "string" && !/<(div|button|span)\b/i.test(html.trim().slice(0,20)) && !html.trim().startsWith("<")){
    body = `<div class="bubble">${html}</div>`;
  }
  document.getElementById("chat-log").insertAdjacentHTML("beforeend",
    `<div class="msg-row assistant"><div class="msg-avatar">JC</div><div class="msg-body">${tag}${body}</div></div>`);
  scrollChat();
}
function addTyping(){
  document.getElementById("chat-log").insertAdjacentHTML("beforeend",
    `<div class="msg-row assistant" id="typing-row"><div class="msg-avatar">JC</div><div class="msg-body"><div class="bubble typing"><span></span><span></span><span></span></div></div></div>`);
  scrollChat();
}
function removeTyping(){ const t=document.getElementById("typing-row"); if(t) t.remove(); }
function afterDelay(fn){ addTyping(); setTimeout(()=>{ removeTyping(); fn(); }, 500 + Math.random()*250); }

function seedGreeting(){
  const name = state.myName.split(" ")[0];
  addAssistantHTML(`<div class="bubble">${tc("greeting", { name })}</div>`);
}

/* ---------- conversational question helpers ---------- */
function askChips(promptHTML, options, resolver){
  addAssistantHTML(`<div class="bubble">${promptHTML}</div>`);
  state.convo.chipRowCounter++;
  const rid = "chiprow" + state.convo.chipRowCounter;
  state.convo.pendingOptions = options;
  state.convo.pendingResolver = resolver;
  const chipsHtml = options.map((o,i)=>`<button class="inline-chip" onclick="pickOption(${i},'${rid}')">${o.label}</button>`).join("");
  const bodies = document.querySelectorAll("#chat-log .msg-row.assistant .msg-body");
  const last = bodies[bodies.length - 1];
  if(last) last.insertAdjacentHTML("beforeend", `<div class="inline-chip-row" id="${rid}">${chipsHtml}</div>`);
  else addAssistantHTML(`<div class="inline-chip-row" id="${rid}">${chipsHtml}</div>`);
  scrollChat();
}
function pickOption(i, rid){
  const opt = state.convo.pendingOptions[i];
  if(!opt) return;
  const row = document.getElementById(rid);
  if(row) row.remove();
  addUser(opt.label);
  const resolver = state.convo.pendingResolver;
  state.convo.pendingOptions = []; state.convo.pendingResolver = null;
  if(resolver) afterDelay(()=>resolver(opt));
}
function askText(promptHTML, resolver, placeholder){
  addAssistantHTML(`<div class="bubble">${promptHTML}</div>`);
  state.convo.pendingTextResolver = resolver;
  const input = document.getElementById("chat-input");
  if(placeholder) input.placeholder = placeholder;
  input.focus();
}
function resetTextPlaceholder(){
  const input = document.getElementById("chat-input");
  if(input) input.placeholder = tc("placeholder");
}

function t(key, vars){
  const pack = I18N[jcAppLanguage] || I18N.english;
  let s = pack[key] ?? I18N.english[key] ?? key;
  if(vars) Object.keys(vars).forEach(k => { s = s.replace("{"+k+"}", String(vars[k])); });
  return s;
}
function tc(key, vars){
  const pack = CHAT_I18N[jcChatLanguage] || CHAT_I18N.english;
  let s = pack[key] ?? CHAT_I18N.english[key] ?? key;
  if(vars) Object.keys(vars).forEach(k => { s = s.replace("{"+k+"}", String(vars[k])); });
  return s;
}

function applyAppLanguage(){
  document.body.classList.toggle("lang-urdu", jcAppLanguage === "urdu");
  document.querySelectorAll("#app-lang-toggle button[data-lang]").forEach(btn => {
    const on = btn.getAttribute("data-lang") === jcAppLanguage;
    btn.classList.toggle("active", on);
    btn.setAttribute("aria-pressed", on ? "true" : "false");
  });
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if(key) el.textContent = t(key);
  });
  // dynamic bits
  if(state && state.last4){
    const mc = document.getElementById("masked-card");
    if(mc) mc.textContent = t("wallet_label") + " · \u2022\u2022\u2022\u2022 " + state.last4;
    if(state.myPhone){
      const ph = document.getElementById("profile-phone");
      if(ph) ph.textContent = state.myPhone + " · " + t("verified_level", { n: state.kycLevel });
    }
  }
  if(typeof renderTxns === "function" && state && state.txns) renderTxns();
  if(typeof renderHomeLoanCard === "function" && state && state.loan) renderHomeLoanCard();
}

function applyChatLanguage(){
  jcReplyLanguage = jcChatLanguage; // alias for API
  document.getElementById("sheet")?.classList.toggle("chat-urdu", jcChatLanguage === "urdu");
  document.querySelectorAll("#chat-lang-toggle button[data-lang]").forEach(btn => {
    const on = btn.getAttribute("data-lang") === jcChatLanguage;
    btn.classList.toggle("active", on);
    btn.setAttribute("aria-pressed", on ? "true" : "false");
  });
  document.querySelectorAll("[data-i18n-chat]").forEach(el => {
    const key = el.getAttribute("data-i18n-chat");
    if(key) el.textContent = tc(key);
  });
  resetTextPlaceholder();
}

function setAppLanguage(lang, opts){
  const silent = opts && opts.silent;
  const next = (lang === "urdu") ? "urdu" : "english";
  const changed = next !== jcAppLanguage;
  jcAppLanguage = next;
  try { localStorage.setItem("jc_app_language", jcAppLanguage); } catch(_e) {}
  applyAppLanguage();
  if(!silent && changed) showToast(t("app_lang_note"));
}
window.setAppLanguage = setAppLanguage;

function setChatLanguage(lang, opts){
  const silent = opts && opts.silent;
  const next = (lang === "urdu") ? "urdu" : "english";
  const changed = next !== jcChatLanguage;
  jcChatLanguage = next;
  jcReplyLanguage = next;
  try {
    localStorage.setItem("jc_chat_language", jcChatLanguage);
    localStorage.setItem("jc_reply_language", jcChatLanguage);
  } catch(_e) {}
  if(changed) jcSessionId = null;
  applyChatLanguage();
  if(changed && !silent){
    // Reset chat so every visible message matches the new chat language
    state.convo.pendingOptions = [];
    state.convo.pendingResolver = null;
    state.convo.pendingTextResolver = null;
    document.getElementById("chat-log").innerHTML = "";
    seedGreeting();
    addAssistantHTML(`<div class="bubble">${tc("chat_lang_note")}</div>`);
  }
}
window.setChatLanguage = setChatLanguage;
// legacy no-op redirect if anything still calls old name for chat
function setReplyLanguage(lang, opts){ setChatLanguage(lang, opts); }
window.setReplyLanguage = setReplyLanguage;

function escapeHtml(s){
  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function routeFromAction(route){
  if(!route) return null;
  const r = String(route).toLowerCase();
  if(r.includes("loan") || r.includes("ready-cash") || r.includes("readycash") || r.includes("repay") || r.includes("installment") || r.includes("qarz")) return "loan";
  if(r.includes("send") || r.includes("transfer") || r.includes("raast")) return "send";
  if(r.includes("bill")) return "bill";
  if(r.includes("recharge") || r.includes("topup") || r.includes("top-up") || r.includes("mobile")) return "topup";
  if(r.includes("add") || r.includes("fund") || r.includes("cash-in") || r.includes("cashin")) return "addmoney";
  if(r.includes("support") || r.includes("recover") || r.includes("fail") || r.includes("transaction")) return "recovery";
  return null;
}

function renderLlmReply(data){
  const text = escapeHtml(data.response || "Sorry, I couldn't generate a reply.");
  const urduClass = (data.language === "urdu") ? ' style="font-family:\'Noto Nastaliq Urdu\',Inter,sans-serif; line-height:1.7;"' : "";
  let html = `<div class="bubble"${urduClass}>${text.replace(/\n/g,"<br>")}</div>`;

  const action = data.suggested_action;
  if(action && action.label && action.route){
    const module = routeFromAction(action.route);
    const safeLabel = escapeHtml(action.label);
    if(module){
      html += `<div class="inline-chip-row"><button class="inline-chip" onclick="quickStart('${module}')">${safeLabel}</button></div>`;
    } else {
      html += `<div class="inline-chip-row"><button class="inline-chip" onclick="addAssistantHTML('<div class=\\'bubble\\'>${escapeHtml(tc("open_route",{route:action.route})).replace(/'/g,"\\'")}</div>')">${safeLabel}</button></div>`;
    }
  }
  if(data.blocked_transaction){
    html += `<div class="inline-chip-row"><button class="inline-chip" onclick="quickStart('send')">${escapeHtml(tc("guide_send"))}</button></div>`;
  }
  const prompts = (data.suggested_prompts || []).slice(0, 3);
  if(prompts.length){
    html += `<div class="inline-chip-row">` +
      prompts.map(p => `<button class="inline-chip" onclick="sendFreeText(${JSON.stringify(p)})">${escapeHtml(p)}</button>`).join("") +
      `</div>`;
  }
  addAssistantHTML(html);
}

async function askBackend(message){
  const L = state.loan || {};
  const context = {
    prototype: "JazzCash_CX4_Agentic_Prototype",
    preferred_language: jcChatLanguage,
    user: {
      name: state.myName,
      phone: state.myPhone,
      wallet_balance: state.balance,
      kyc_level: state.kycLevel,
    },
    ready_cash_loan: {
      product: "Ready Cash",
      status: L.status,
      original: L.original,
      outstanding: L.outstanding,
      installment: L.installment,
      remaining_payments: L.remaining,
      overdue_days: L.overdueDays,
      late_fee: L.lateFee,
      due_text: typeof loanDueText === "function" ? loanDueText("chat") : null,
      selected_plan: L.selectedPlan ? L.selectedPlan.name : null,
      reminder: L.reminder,
    },
    note: "Concept Demo — UI modules guide flows; assistant must not execute real money moves. For loans use /loans.",
  };
  const res = await fetch(`${API_BASE}/api/chat`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      message,
      session_id: jcSessionId || undefined,
      stream: false,
      preferred_language: jcChatLanguage,
      context,
    }),
  });
  if(!res.ok){
    const errText = await res.text();
    throw new Error(errText || res.statusText);
  }
  const data = await res.json();
  if(data.session_id) jcSessionId = data.session_id;
  return data;
}

async function sendFreeText(text){
  const msg = String(text || "").trim();
  if(!msg || jcChatBusy) return;
  jcChatBusy = true;
  addUser(msg);
  addTyping();
  try{
    let data = await askBackend(msg);
    // Client safety net: if UI is Urdu-locked but reply drifted to English, force one retry
    if(jcChatLanguage === "urdu" && data && data.response){
      const urduChars = (data.response.match(/[\u0600-\u06FF]/g) || []).length;
      const latinChars = (data.response.match(/[A-Za-z]/g) || []).length;
      const ratio = (urduChars + latinChars) ? urduChars / (urduChars + latinChars) : 0;
      if(ratio < 0.55){
        data = await askBackend(
          msg + "\n\n[سیستم: پچھلا جواب انگریزی میں تھا — اب صرف اردو رسم الخط میں جواب دیں۔]"
        );
      }
    }
    removeTyping();
    renderLlmReply(data);
  } catch(err){
    removeTyping();
    addAssistantHTML(`<div class="bubble">${tc("api_error")}<br><span style="color:var(--muted); font-size:11px;">${escapeHtml(err.message || err)}</span></div>`);
  } finally {
    jcChatBusy = false;
  }
}

/* ---------- composer routing ---------- */
function handleComposerSend(){
  const input = document.getElementById("chat-input");
  const text = input.value.trim();
  if(!text) return;
  input.value = "";
  if(state.convo.pendingTextResolver){
    addUser(text);
    const resolver = state.convo.pendingTextResolver;
    state.convo.pendingTextResolver = null;
    resetTextPlaceholder();
    return afterDelay(()=>resolver(text));
  }
  // Free chat → Jazz Gemma; structured chips still open local module flows
  sendFreeText(text);
}
function quickStart(kind){
  state.convo.pendingOptions = []; state.convo.pendingResolver = null; state.convo.pendingTextResolver = null;
  resetTextPlaceholder();
  if(kind==="send") return startSend({});
  if(kind==="bill") return startBill();
  if(kind==="topup") return startTopup();
  if(kind==="addmoney") return startAddMoney();
  if(kind==="recovery") return startRecovery();
  if(kind==="loan") return startLoanFlow();
}

/* ============================================================
   FLOW 1 — SEND MONEY (multi-turn)
   ============================================================ */
function startSend(prefill){
  const data = Object.assign({contact:null, amount:null}, prefill);
  if(data.contact && data.amount) return showSendConfirm(data);
  if(data.contact) return askSendAmount(data);
  addUser(tc("flow_send_user"));
  afterDelay(()=>{
    const options = state.contacts.slice(0,4).map(c=>({label:c.name.split(" ")[0], contact:c}));
    options.push({label:tc("someone_else"), other:true});
    askChips(tc("flow_send_who"), options, (opt)=>{
      if(opt.other){
        askText(tc("flow_send_name"), (name)=>{
          const found = state.contacts.find(c=>c.name.toLowerCase().includes(name.toLowerCase())) || {name, phone:randomPhone()};
          askSendAmount({contact:found});
        }, tc("ph_name"));
      } else askSendAmount({contact:opt.contact});
    });
  });
}
function askSendAmount(data){
  askText(tc("flow_send_amount", { name: data.contact.name.split(" ")[0] }), (text)=>{
    const m = text.match(/[\d,]+/);
    const amt = m ? parseInt(m[0].replace(/,/g,"")) : randInt(500,5000);
    showSendConfirm(Object.assign({}, data, {amount:amt}));
  }, tc("ph_amount"));
}
function showSendConfirm(data){
  const fee = 15;
  const resulting = state.balance - data.amount - fee;
  addAssistantHTML(tc("flow_send_summary", { amount: fmt(data.amount), name: data.contact.name }));
  addAssistantHTML(`
    <div class="card">
      <div class="card-title"><div class="av">${initials(data.contact.name)}</div><div><b>${data.contact.name}</b><small>${tc("verified_jc")}</small></div></div>
      <div class="card-row"><span class="k">${tc("amount")}</span><span class="v">${fmt(data.amount)}</span></div>
      <div class="card-row"><span class="k">${tc("fee")}</span><span class="v">${fmt(fee)}</span></div>

function startRecovery(){

  addUser(tc("flow_fail_user"));
  afterDelay(()=>{
    askChips(tc("flow_fail_ask", { title: f.title, amount: fmt(f.amount) }),
      [{label:tc("what_happened"), action:"explain"},{label:tc("retry"), action:"retry"},{label:tc("support"), action:"support"}],
      (opt)=>{

        if(opt.action==="retry") return startSend({contact:{name:f.title, phone:"—"}, amount:f.amount});
        if(opt.action==="support") return connectSupport();

  });

  const card = btn.closest(".card");
  card.innerHTML = `<div style="text-align:center; color:var(--muted); padding:6px 0;">${tc("no_action")}</div>`;

function approveAction(btn, type, payload){
  const card = btn.closest(".card");
  card.innerHTML = `<div style="display:flex; align-items:center; gap:8px; padding:6px 0; color:var(--muted);"><div class="typing"><span></span><span></span><span></span></div> ${tc("working")}</div>`;
  setTimeout(()=>{
    let title, sub;
    if(type==="send"){ state.balance -= (payload.amount+payload.fee); state.totalSent += payload.amount; title=tc("sent"); sub=tc("sub_sent",{amt:fmt(payload.amount),name:payload.name}); state.txns.unshift({type:"send",title:"Sent to "+payload.name,sub:"P2P transfer",amount:payload.amount,sign:"-",ok:true,when:"Just now"}); }
    if(type==="bill"){ state.balance -= payload.amount; state.totalSent += payload.amount; title=tc("bill_paid"); sub=tc("sub_bill",{name:payload.name,amt:fmt(payload.amount)}); state.txns.unshift({type:"bill",title:payload.name+" Bill",sub:"Utility payment",amount:payload.amount,sign:"-",ok:true,when:"Just now"}); }
    if(type==="topup"){ state.balance -= payload.amount; state.totalSent += payload.amount; title=tc("activated"); sub=tc("sub_topup",{name:payload.name}); state.txns.unshift({type:"topup",title:payload.name,sub:"Mobile top-up",amount:payload.amount,sign:"-",ok:true,when:"Just now"}); }
    if(type==="addmoney"){ state.balance += payload.amount; state.totalReceived += payload.amount; title=tc("money_added"); sub=tc("sub_addmoney",{amt:fmt(payload.amount),name:payload.name}); state.txns.unshift({type:"credit",title:"Wallet top-up via "+payload.name,sub:"Bank transfer in",amount:payload.amount,sign:"+",ok:true,when:"Just now"}); }
    card.innerHTML = `<div class="success-box"><div class="success-check">\u2713</div><b>${title}</b><span style="color:var(--muted); font-size:12px;">${sub}</span></div>`;
    renderAll();
    scrollChat();
  }, 900);
}

/* ============================================================
   FLOW 6 — LOAN REPAYMENT MANAGEMENT (add-on only)
   ============================================================ */
function loanDueText(mode){
  const tr = mode === "app" ? t : tc;
  const l=state.loan;
  if(l.outstanding<=0 || l.status==="Paid Off") return tr("due_repaid");
  if(l.status==="Behind") return tr("due_overdue", { n: l.overdueDays });
  if(l.status==="Due Today") return tr("due_today");
  const days=Math.max(1,Math.ceil((l.due-Date.now())/86400000));
  return tr("due_in", { n: days });
}
function startLoanFlow(){
  const l=state.loan;
  addUser(tc("flow_loan_user"));
  afterDelay(()=>{
    if(l.outstanding<=0 || l.status==="Paid Off"){
      addAssistantHTML(`<div class="bubble">${tc("loan_paid")}</div>`);
      return;
    }
    if(l.status==="Behind"){
      askChips(tc("loan_behind_ask", { days: l.overdueDays, inst: fmt(l.installment), catchup: fmt(l.installment+l.lateFee), fee: fmt(l.lateFee) }),[
        {label:tc("see_plans"), action:"plans"},
        {label:tc("explain_charges"), action:"charges"},
        {label:tc("catchup_pay"), action:"pay"}
      ], loanResolve);
    } else {
      askChips(tc("loan_ok_ask", { inst: fmt(l.installment), due: loanDueText("chat"), n: l.remaining }),[
        {label:tc("pay_next"), action:"pay"},
        {label:tc("compare_plans"), action:"plans"},
        {label:tc("if_late"), action:"charges"},
        {label:tc("set_reminder"), action:"reminder"}
      ], loanResolve);
    }
  });
}
function loanResolve(opt){
  if(opt.action==="plans") return showLoanPlans();
  if(opt.action==="charges") return explainLoanCharges();
  if(opt.action==="reminder") return setLoanReminder();
  prepareLoanPayment(state.loan.status==="Behind");
}
function explainLoanCharges(){
  const l=state.loan;
  const detail = l.status==="Behind"
    ? tc("charges_behind", { days: l.overdueDays, fee: fmt(l.lateFee), catchup: fmt(l.installment+l.lateFee) })
    : tc("charges_ok");
  addAssistantHTML(`<div class="bubble">${tc("charges_intro", { inst: fmt(l.installment), detail })}</div>`);
  addAssistantHTML(`<div class="card">
    <div class="card-row"><span class="k">${tc("k_regular")}</span><span class="v">${fmt(l.installment)}</span></div>
    <div class="card-row"><span class="k">${tc("k_late")}</span><span class="v">${fmt(l.lateFee)}</span></div>
    <div class="card-row"><span class="k">${tc("k_catchup")}</span><span class="v">${fmt(l.status==="Behind"?l.installment+l.lateFee:l.installment)}</span></div>
    <div class="loan-note">${tc("loan_note_illust")}</div>
  </div>`);
  askChips(tc("compare_options"),[
    {label:tc("show_plans"), action:"plans"},
    {label:tc("not_now"), action:"later"}
  ], opt=>{ if(opt.action==="plans") showLoanPlans(); else addAssistantHTML(`<div class="bubble">${tc("plan_unchanged")}</div>`); });
}
function showLoanPlans(){
  const l=state.loan;
  const base=Math.max(1,l.outstanding+(l.status==="Behind"?l.lateFee:0));
  const periods=l.remaining;
  const plans=[
    {nameKey:"plan_faster", descKey:"plan_faster_desc", amount:Math.ceil((base/Math.max(1,Math.ceil(periods*0.75)))/100)*100, periods:Math.max(1,Math.ceil(periods*0.75))},
    {nameKey:"plan_balanced", descKey:"plan_balanced_desc", amount:Math.ceil((base/Math.max(1,periods))/100)*100, periods:Math.max(1,periods)},
    {nameKey:"plan_lower", descKey:"plan_lower_desc", amount:Math.ceil((base/(periods+3))/100)*100, periods:periods+3}
  ];
  l.planOptions=plans;
  addAssistantHTML(`<div class="bubble">${tc("plans_intro_full")}</div>`);
  plans.forEach((p,i)=>{
    const rid="loan-plan-"+(++state.convo.chipRowCounter);
    addAssistantHTML(`<div class="card loan-plan" id="${rid}" onclick="selectLoanPlan(${i},'${rid}')">
      <b>${tc(p.nameKey)}</b><small>${tc(p.descKey)}</small>
      <div class="loan-plan-row"><span>${tc("per_month", { amt: fmt(p.amount) })}</span><span>${tc("n_payments", { n: p.periods })}</span></div>
    </div>`);
  });
}
function selectLoanPlan(i,rid){
  const plans=state.loan.planOptions || [];
  const p=plans[i];
  if(!p) return;
  document.querySelectorAll('.loan-plan').forEach(x=>x.classList.remove('selected'));
  const el=document.getElementById(rid); if(el) el.classList.add('selected');
  const planName = tc(p.nameKey);
  addUser(planName);
  afterDelay(()=>{
    addAssistantHTML(`<div class="card">
      <div class="card-title"><div class="av">💳</div><div><b>${planName}</b><small style="color:var(--muted); font-weight:500;">${tc("illustrative")}</small></div></div>
      <div class="card-row"><span class="k">${tc("k_payment")}</span><span class="v">${tc("per_month", { amt: fmt(p.amount) })}</span></div>
      <div class="card-row"><span class="k">${tc("k_periods")}</span><span class="v">${p.periods}</span></div>
      <div class="btn-row"><button class="btn primary" onclick="confirmLoanPlan(${i})">${tc("choose_plan")}</button><button class="btn outline" onclick="cancelAction(this)">${tc("keep_current")}</button></div>
    </div>`);
  });
}
function confirmLoanPlan(i){
  const p=(state.loan.planOptions||[])[i];
  if(!p) return;
  state.loan.selectedPlan={...p, name: tc(p.nameKey)};
  state.loan.installment=p.amount;
  state.loan.remaining=p.periods;
  state.loan.outstanding=p.amount*p.periods;
  state.loan.lateFee=0;
  state.loan.overdueDays=0;
  state.loan.status="On Track";
  state.loan.due=Date.now()+3*24*60*60*1000;
  renderAll();
  const planName = tc(p.nameKey);
  showToast(tc("plan_toast", { name: planName, amt: fmt(p.amount), n: p.periods }));
  addAssistantHTML(`<div class="success-box"><div class="success-check">✓</div><b>${tc("plan_updated")}</b><span style="color:var(--muted); font-size:12px;">${tc("plan_updated_sub", { amt: fmt(p.amount), n: p.periods })}</span></div>`);
}
function prepareLoanPayment(catchup){
  const l=state.loan;
  const amount=catchup ? l.installment+l.lateFee : l.installment;
  addAssistantHTML(`<div class="bubble">${tc("prepare_repay", { amount: fmt(amount) })}</div>`);
  addAssistantHTML(`<div class="card">
    <div class="card-title"><div class="av">💳</div><div><b>${tc("loan_repay_title")}</b><small style="color:var(--muted); font-weight:500;">${catchup?tc("catchup_label"):tc("next_inst")}</small></div></div>
    <div class="card-row"><span class="k">${tc("amount")}</span><span class="v">${fmt(amount)}</span></div>
    <div class="card-row"><span class="k">${tc("wallet_bal")}</span><span class="v">${fmt(state.balance)}</span></div>
    <div class="card-row"><span class="k">${tc("balance_after")}</span><span class="v">${fmt(Math.max(0,state.balance-amount))}</span></div>
    <div class="btn-row"><button class="btn primary" onclick="approveLoanPayment(this,${amount})">${tc("approve_repay")}</button><button class="btn outline" onclick="cancelAction(this)">${tc("cancel")}</button></div>
  </div>`);
}
function approveLoanPayment(btn,amount){
  const card=btn.closest('.card');
  card.innerHTML=`<div style="display:flex; align-items:center; gap:8px; padding:6px 0; color:var(--muted);"><div class="typing"><span></span><span></span><span></span></div> ${tc("processing_repay")}</div>`;
  setTimeout(()=>{
    if(state.balance < amount){ card.innerHTML=`<div style="color:var(--jc-red); font-size:12px;">${tc("insufficient")}</div>`; return; }
    state.balance-=amount;
    state.totalSent+=amount;
    const fee=state.loan.status==="Behind" ? state.loan.lateFee : 0;
    state.loan.outstanding=Math.max(0,state.loan.outstanding-Math.max(0,amount-fee));
    state.loan.lateFee=0;
    state.loan.overdueDays=0;
    state.loan.paid+=1;
    state.loan.remaining=Math.max(0,state.loan.remaining-1);
    state.loan.status=state.loan.outstanding<=0 ? "Paid Off" : "On Track";
    if(state.loan.outstanding<=0) state.loan.due=null;
    else state.loan.due=Date.now()+3*24*60*60*1000;
    state.txns.unshift({type:"loan",title:"Loan repayment",sub:"Loan installment",when:"Just now",amount,sign:"-",ok:true});
    renderAll();
    card.innerHTML=`<div class="success-box"><div class="success-check">✓</div><b>${tc("repay_complete")}</b><span style="color:var(--muted); font-size:12px;">${tc("repay_applied", { amt: fmt(amount) })}</span></div>`;
    scrollChat();
  },900);
}
function setLoanReminder(){
  askChips(tc("reminder_ask"),[
    {label:tc("rem_3"), value:"3 days before"},
    {label:tc("rem_1"), value:"1 day before"},
    {label:tc("rem_due"), value:"On the due date"},
    {label:tc("rem_none"), value:"No reminder"}
  ],opt=>{
    state.loan.reminder=opt.value;
    const msg = opt.value==="No reminder" ? tc("rem_none_saved") : tc("rem_saved", { when: opt.label });
    addAssistantHTML(`<div class="bubble">${msg}</div><div class="loan-note">${tc("rem_proto")}</div>`);
  });
}

/* ============================================================
   PROACTIVE + SELF-HEALING ENGINE (debounced, no overlap)
   ============================================================ */
function updateBadge(n){
  state.badge = n;
  document.getElementById("tab-dot").style.display = n>0 ? "block" : "none";
}

const NUDGE_CONTENT = {
  bill: ()=>{
    const b = state.flaggedBiller;
    return { kind:"proactive", title:tc("title_bill"), sub:tc("sub_bill_n",{name:b.name,amt:fmt(b.amount),n:b.dueInDays}),
      toast:tc("toast_bill",{name:b.name,amt:fmt(b.amount),n:b.dueInDays,inc:fmt(b.increase)}),
      action:()=> askChips(tc("nudge_pay_ask"), [{label:tc("nudge_yes_pay"), biller:b},{label:tc("nudge_remind"), later:true}], (opt)=>{
        if(opt.later) return addAssistantHTML(`<div class="bubble">${tc("nudge_remind_ok")}</div>`);
        startBill(opt.biller);
      }) };
  },
  topup: ()=>({ kind:"proactive", title:tc("title_topup"), sub:tc("sub_topup_n",{pkg:state.pkg.name,hours:state.topupExpiresHours}),
    toast:tc("toast_topup",{pkg:state.pkg.name,hours:state.topupExpiresHours,price:fmt(state.pkg.price)}),
    action:()=> showTopupConfirm(state.pkg) }),
  recovery: ()=>({ kind:"proactive", title:tc("title_recovery"), sub:tc("sub_recovery_n",{title:state.failedTxn.title}),
    toast:tc("toast_recovery",{title:state.failedTxn.title,amt:fmt(state.failedTxn.amount)}),
    action:()=> explainFailure() }),
  offer: ()=>{
    const o = pick(state.offers);
    return { kind:"proactive", title:tc("title_offer"), sub:tc("sub_offer_n",{merchant:o.merchant,discount:o.discount}),
      toast:tc("toast_offer",{ico:o.ico,reason:o.reason,discount:o.discount.toLowerCase(),merchant:o.merchant}),
      action:()=>{
        state.convo.chipRowCounter++;
        const rid = "chiprow"+state.convo.chipRowCounter;
        addAssistantHTML(`<div class="inline-chip-row" id="${rid}"><button class="inline-chip" onclick="redeemOffer(${JSON.stringify(o).replace(/"/g,'&quot;')}, '${rid}')">${tc("get_code")}</button></div>`);
      } };
  },
  loan: ()=>{
    const l=state.loan;
    const subLabel = l.status==="Behind" ? tc("sub_loan_catchup") : l.status==="Due Today" ? tc("sub_loan_due_today") : tc("sub_loan_next");
    return { kind:"proactive", title:tc("title_loan"), sub:`${subLabel} · ${fmt(l.installment)}`,
      toast:l.status==="Behind"
        ? tc("toast_loan_behind",{days:l.overdueDays,catchup:fmt(l.installment+l.lateFee),fee:fmt(l.lateFee)})
        : tc("toast_loan_ok",{inst:fmt(l.installment),due:loanDueText("chat")}),
      action:()=>startLoanFlow() };
  },
  selfheal: ()=>{
    const options = [
      { issueKey:"heal_issue_dup", fixKey:"heal_fix_dup" },
      { issueKey:"heal_issue_sync", fixKey:"heal_fix_sync" },
      { issueKey:"heal_issue_stuck", fixKey:"heal_fix_stuck" },
    ];
    const pickIssue = pick(options);
    const issue = tc(pickIssue.issueKey);
    const fix = tc(pickIssue.fixKey);
    return { kind:"heal", title:tc("title_heal"), sub:issue,
      toast:tc("toast_heal",{issue,fix}),
      action:()=> addAssistantHTML(`<div class="bubble">${tc("heal_note")}</div>`) };
  }
};
let pendingNudgeAction = null;
let nudgeCooldown = false;
const NUDGE_BTN_IDS = ["nb-bill","nb-topup","nb-recovery","nb-offer","nb-heal","nb-loan"];

function setNudgeButtonsEnabled(enabled){
  NUDGE_BTN_IDS.forEach(id=>{ const b=document.getElementById(id); if(b) b.disabled = !enabled; });
}

function showToast(text, kind){
  const t = document.getElementById("toast");
  t.className = "toast" + (kind==="heal" ? " heal" : "");
  t.innerHTML = `<div class="ic">${kind==="heal" ? "\u{1FA7A}" : "\u{1F514}"}</div><div><b>${tc("assistant_title")}</b><span>${text}</span></div>`;
  t.classList.add("show");
  t.onclick = ()=>{ t.classList.remove("show"); openAssistant(); };
  setTimeout(()=> t.classList.remove("show"), 4200);
}
function showNudgeBanner(n){
  document.getElementById("nudge-title").textContent = n.title;
  document.getElementById("nudge-sub").textContent = n.sub;
  document.getElementById("home-nudge").classList.add("show");
}
function hideNudgeBanner(){ document.getElementById("home-nudge").classList.remove("show"); }
function openNudgeFromBanner(){ openAssistant(); runPendingNudgeAction(); }
function runPendingNudgeAction(){ if(pendingNudgeAction){ const fn = pendingNudgeAction; pendingNudgeAction = null; fn(); } }

function fireNudge(kind){
  if(nudgeCooldown) return; // prevents back-to-back overlapping triggers
  nudgeCooldown = true;
  setNudgeButtonsEnabled(false);

  const n = NUDGE_CONTENT[kind]();
  pendingNudgeAction = n.action;
  showToast(n.toast, n.kind);
  if(n.kind==="proactive"){ showNudgeBanner(n); updateBadge(state.badge + 1); }
  addAssistantHTML(`<div class="bubble">${n.toast}</div>`, n.kind);

  state.convo.chipRowCounter++;
  const rid = "chiprow"+state.convo.chipRowCounter;
  const label = n.kind==="heal" ? tc("got_it") : tc("lets_handle");
  document.getElementById("chat-log").insertAdjacentHTML("beforeend",
    `<div class="msg-row assistant"><div class="msg-avatar" style="visibility:hidden;">JC</div><div class="msg-body"><div class="inline-chip-row" id="${rid}"><button class="inline-chip" onclick="document.getElementById('${rid}').remove(); runPendingNudgeAction();">${label}</button></div></div></div>`);
  scrollChat();

  setTimeout(()=>{ nudgeCooldown = false; setNudgeButtonsEnabled(true); }, 3200);
}

/* ============================================================
   INIT
   ============================================================ */
function init(){
  generateDemoData();
  setAppLanguage(jcAppLanguage, { silent: true });
  setChatLanguage(jcChatLanguage, { silent: true });
  renderAll();
  seedGreeting();
  const now = new Date();
  document.getElementById("clock").textContent = now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}
init();
</script>
